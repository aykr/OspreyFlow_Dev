# The rules `scripts/maintainer_manifest.py` reads: which area a tracked file belongs to, what language it is, which files
# are tests, and which are generated, and by what. TOML, so the standard library reads it.
#
# Paths are relative to the root of the product tree (`apps/...`, `packages/...`). Three kinds of pattern, all matched
# on whole path segments (a `*` or `?` never crosses a `/`):
#   * a path prefix: `packages/schemas` is that folder and everything in it, or that one file;
#   * in `[tests]`, a name with no slash (`*.test.ts`) is a file name at any depth, and a name ending in a slash
#     (`tests/`) is a folder of that name at any depth;
#   * `except` removes a prefix from one rule (the rule below it, or another area, then owns it).
#
# AREAS. A file's area is where it lives: `is_test` says whether it is a test, and a test stays in the area of the
# folder it is in. The area `tests` holds only a top-level `tests/` folder, which the product tree has none of today
# (its Python tests are kept in the developer repository).
#
# FIRST MATCH WINS in the order the `[[area]]` tables are written below, and `other` is last. The areas check
# (`python -m scripts.maintainer_manifest --check-areas`) is stricter than the order: it fails if any tracked file
# matches no area, or matches two, so the order never has to settle an overlap in the real tree.
#
# `other` IS NOT A CATCH-ALL. It names each folder and each top-level file it holds, exactly: a name with a `*`, `?` or
# `[` in it is refused by the check. A new folder that no rule here covers fails the check; its author adds its rule
# in the same change (a theme folder under `packages/themes`, a tree under `apps/pages`, a new service).

version = 1

# `header`: a file is generated by its own evidence when one of these words is in its first lines (any case).
[header]
lines = 10
markers = ["AUTO-GENERATED", "@generated", "DO NOT EDIT"]

[languages]
".ts" = "TypeScript"
".mts" = "TypeScript"
".tsx" = "TypeScript (JSX)"
".js" = "JavaScript"
".mjs" = "JavaScript"
".py" = "Python"
".java" = "Java"
".sh" = "Shell"
".ps1" = "PowerShell"
".html" = "HTML"
".css" = "CSS"
".njk" = "Nunjucks template"
".md" = "Markdown"
".json" = "JSON"
".yaml" = "YAML"
".yml" = "YAML"
".toml" = "TOML"
".xml" = "XML"
".bpmn" = "BPMN"
".csv" = "CSV"
".txt" = "Text"
".tf" = "Terraform"
".tftpl" = "Terraform template"
".hcl" = "Terraform"
".tpl" = "Helm template"
".template" = "Template"
".in" = "Dependency list"
".lock" = "Lock file"
".sha256" = "Checksums"
".svg" = "SVG image"
".png" = "PNG image"
".jpg" = "JPEG image"
".jpeg" = "JPEG image"
".gif" = "GIF image"
".pdf" = "PDF document"
".pmtiles" = "Map tiles"

[language_files]
"Dockerfile" = "Dockerfile"
"Makefile" = "Makefile"
".gitkeep" = "Placeholder"
".gitignore" = "Ignore list"
".dockerignore" = "Ignore list"
".trivyignore" = "Ignore list"
".helmignore" = "Ignore list"
".terraform.lock.hcl" = "Terraform"
"NOTICE" = "Text"
"JAVA_NOTICE" = "Text"
"LICENSE" = "Text"
"VERSION" = "Text"

[tests]
patterns = ["*.test.ts", "*.test.tsx", "*.spec.ts", "test/", "tests/", "keyboard/", "a11y/"]

# GENERATED. Evidence is the repository's own: a header in the file (above), or a rule here that names the file or folder
# AND a generator script that is in the tree at the ref. A rule whose generator is not in the tree (or that names none)
# gives `no evidence in this tree`, never `yes`; a folder's name is never evidence.
[[generated]]
paths = ["packages/schemas/generated", "packages/schemas/release.schema.json"]
generator = "packages/schemas/generate_ts.py"
command = "npm run schemas:generate"

[[generated]]
paths = ["deploy/superset/osprey_theme.json"]
generator = "scripts/superset_theme.py"
command = "python -m scripts.superset_theme"

[[generated]]
paths = ["apps/workspace/PL4_BASELINE.json"]
generator = "scripts/dist_compare.mjs"
command = "node scripts/dist_compare.mjs rebaseline"

[[generated]]
paths = ["docs/pdf"]
generator = ""
note = "built by the document build, whose script is kept in the developer repository, not in this tree"

[[generated]]
paths = ["packages/glass-shared/src/shell/placesByRole.json"]
generator = ""
note = "written by a test of the developer repository; no script in this tree writes it"

[[area]]
name = "page service server"
paths = [
  "apps/pages/server",
  "apps/pages/scripts",
  "apps/pages/test",
  "apps/pages/Dockerfile",
  "apps/pages/FUNCTIONS.yaml",
  "apps/pages/PARITY_EXCEPTIONS.yaml",
  "apps/pages/README.md",
  "apps/pages/package.json",
  "apps/pages/tsconfig.json",
  "apps/pages/tsconfig.build.json",
  "apps/pages/vitest.config.ts",
]

[[area]]
name = "GOV.UK tree"
paths = ["apps/pages/tree-govuk", "packages/themes/govuk"]

[[area]]
name = "default tree"
paths = ["apps/pages/tree-default"]

[[area]]
name = "drawing modules"
paths = ["apps/pages/modules"]

[[area]]
name = "shared TypeScript"
paths = ["packages/glass-shared"]

[[area]]
name = "design"
paths = ["packages/design"]

[[area]]
name = "schemas"
paths = ["packages/schemas"]

[[area]]
name = "React workspace"
paths = ["apps/workspace"]

[[area]]
name = "Conduit"
paths = ["services/api"]

[[area]]
name = "ingest"
paths = ["services/ingest", "connectors"]

# The optional engine's folder is shown with its own paths, not masked: the list is exact.
[[area]]
name = "other service"
paths = [
  "services/compute",
  "services/extract",
  "services/geocoder",
  "services/laurium",
  "services/ner",
  "services/report_sync",
  "services/resolve",
  "services/search_index",
  "services/worker",
]

[[area]]
name = "adapters"
paths = ["packages/adapters"]

[[area]]
name = "knowledge adapters"
paths = ["packages/knowledge_adapters"]

[[area]]
name = "deploy"
paths = ["deploy", ".github"]

[[area]]
name = "tests"
paths = ["tests"]

[[area]]
name = "domain libraries"
paths = ["packages/ontology", "packages/geo", "packages/rule_standards", "packages/demo_fixtures"]

[[area]]
name = "shared Conduit libraries"
paths = ["packages/ports", "packages/conduit_common", "packages/principal_auth"]

[[area]]
name = "install page"
paths = ["apps/harness"]

[[area]]
name = "operations"
paths = ["scripts", "harness", "cli"]

[other]
folders = ["docs", "notices", "config", "providers", "recipes"]
files = [
  "apps/lanePorts.ts",
  "README.md",
  "DESIGN.md",
  "DEMO_GUIDE.md",
  "CHANGELOG.md",
  "NOTICE",
  "LICENSE",
  "VERSION",
  "osprey.yaml",
  "pyproject.toml",
  "uv.lock",
  "package.json",
  "package-lock.json",
  "tsconfig.json",
  "eslint.config.js",
  "install.sh",
  "install.ps1",
  "Makefile",
  ".gitignore",
  ".dockerignore",
  ".trivyignore",
]
