<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="t d">
<title id="t">OspreyFlow, level 0</title><desc id="d">The people who use OspreyFlow, its three tiers joined by four ports, and the identity provider, reporting, data sources and optional outside services beside it.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#4b4e4e"/></marker></defs>
<rect width="1240" height="700" fill="#ffffff"/>
<text xml:space="preserve" x="24" y="34" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#191b1c" text-anchor="start">OspreyFlow at level 0: who uses it, and what it talks to</text>
<text xml:space="preserve" x="24" y="56" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#66696a" text-anchor="start">Three tiers joined by four ports; identity and reporting beside them, never inside</text>
<text xml:space="preserve" x="24" y="108" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8a6318" text-anchor="start">PEOPLE</text>
