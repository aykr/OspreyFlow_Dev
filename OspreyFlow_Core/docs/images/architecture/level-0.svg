<rect x="332" y="84" width="160" height="40" rx="6" fill="#e8eced" stroke="#bbbebf" stroke-width="1.2"/>
<text xml:space="preserve" x="412.0" y="106" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#191b1c" text-anchor="middle">Data engineer</text>
<rect x="504" y="84" width="160" height="40" rx="6" fill="#e8eced" stroke="#bbbebf" stroke-width="1.2"/>
<text xml:space="preserve" x="584.0" y="106" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#191b1c" text-anchor="middle">Administrator</text>
<rect x="676" y="84" width="160" height="40" rx="6" fill="#e8eced" stroke="#bbbebf" stroke-width="1.2"/>
<text xml:space="preserve" x="756.0" y="106" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#191b1c" text-anchor="middle">Compliance · BI reader</text>
<line x1="240" y1="124" x2="240" y2="142" stroke="#4b4e4e" stroke-width="1.4"/>
<line x1="412" y1="124" x2="412" y2="142" stroke="#4b4e4e" stroke-width="1.4"/>
<line x1="584" y1="124" x2="584" y2="142" stroke="#4b4e4e" stroke-width="1.4"/>
<line x1="756" y1="124" x2="756" y2="142" stroke="#4b4e4e" stroke-width="1.4"/>
<line x1="240" y1="142" x2="756" y2="142" stroke="#4b4e4e" stroke-width="1.4"/>
<rect x="140" y="160" width="730" height="430" rx="10" fill="none" stroke="#a2a5a6" stroke-width="1.2" stroke-dasharray="2 3"/>
<text xml:space="preserve" x="152" y="178" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#66696a" text-anchor="start">ONE OSPREYFLOW DEPLOYMENT</text>
<line x1="505" y1="142" x2="505" y2="196" stroke="#4b4e4e" stroke-width="1.4" marker-end="url(#a)"/>
<text xml:space="preserve" x="517" y="186" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#66696a" text-anchor="start">a browser, over HTTPS</text>
<text xml:space="preserve" x="24" y="234" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8a6318" text-anchor="start">THE GLASS</text>
<rect x="160" y="198" width="690" height="70" rx="6" fill="#f1f4f5" stroke="#bbbebf" stroke-width="1.2"/>
<text xml:space="preserve" x="505.0" y="220" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#191b1c" text-anchor="middle">The Glass — the workspace in the browser</text>
<text xml:space="preserve" x="170" y="240.0" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">Graph · Map · Timeline · Reports · Matrix · the Ingest Studio · the Admin area</text>
<line x1="300" y1="268" x2="300" y2="322" stroke="#4b4e4e" stroke-width="1.4" marker-end="url(#a)"/>
<text xml:space="preserve" x="312" y="300" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#66696a" text-anchor="start">REST + live updates · a bearer token on every call</text>
<text xml:space="preserve" x="24" y="360" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8a6318" text-anchor="start">THE CONDUIT</text>
<rect x="160" y="324" width="690" height="70" rx="6" fill="#f1f4f5" stroke="#bbbebf" stroke-width="1.2"/>
<text xml:space="preserve" x="505.0" y="346" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#191b1c" text-anchor="middle">The Conduit — the API</text>
<text xml:space="preserve" x="170" y="366.0" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">Rights and case levels · rules and jobs · loads · reports · the audit and export ledger</text>
<line x1="300" y1="394" x2="300" y2="448" stroke="#4b4e4e" stroke-width="1.4" marker-end="url(#a)"/>
<text xml:space="preserve" x="312" y="426" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#8a6318" text-anchor="start">GraphPort · AnalyticsPort · ComputePort · ModelPort</text>
<text xml:space="preserve" x="24" y="486" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8a6318" text-anchor="start">THE VAULT</text>
<rect x="160" y="450" width="690" height="70" rx="6" fill="#f1f4f5" stroke="#bbbebf" stroke-width="1.2"/>
<text xml:space="preserve" x="505.0" y="472" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#191b1c" text-anchor="middle">The Vault — the stores and the models</text>
<text xml:space="preserve" x="170" y="492.0" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">Graph store · analytics · graph compute · models · records, cache, files and search</text>
<text xml:space="preserve" x="160" y="560" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">Access control is inside every store query: a hidden record is never counted.</text>
<rect x="910" y="170" width="300" height="104" rx="6" fill="#f1f4f5" stroke="#bbbebf" stroke-width="1.2"/>
<text xml:space="preserve" x="1060.0" y="192" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#191b1c" text-anchor="middle">Identity provider</text>
<text xml:space="preserve" x="920" y="212.0" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">Sign-in for the Glass and the dashboards:</text>
<text xml:space="preserve" x="920" y="228.5" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">Keycloak, or your organisation&#x27;s own</text>
<text xml:space="preserve" x="920" y="245.0" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">sign-in (OIDC)</text>
<line x1="852" y1="233" x2="908" y2="233" stroke="#4b4e4e" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="910" y="320" width="300" height="110" rx="6" fill="#f1f4f5" stroke="#bbbebf" stroke-width="1.2"/>
<text xml:space="preserve" x="1060.0" y="342" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#191b1c" text-anchor="middle">Reporting</text>
<text xml:space="preserve" x="920" y="362.0" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">report-sync pulls each granted case into</text>
<text xml:space="preserve" x="920" y="378.5" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">a reporting database; Superset or</text>
<text xml:space="preserve" x="920" y="395.0" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">Power BI reads it, read-only</text>
<line x1="852" y1="359" x2="908" y2="372" stroke="#4b4e4e" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="836,104 1226,104 1226,392" fill="none" stroke="#4b4e4e" stroke-width="1.4"/>
<line x1="1226" y1="392" x2="1212" y2="392" stroke="#4b4e4e" stroke-width="1.4" marker-end="url(#a)"/>
<text xml:space="preserve" x="1118" y="96" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#66696a" text-anchor="start">reads the boards</text>
<rect x="910" y="470" width="300" height="92" rx="6" fill="#f1f4f5" stroke="#bbbebf" stroke-width="1.2"/>
<text xml:space="preserve" x="1060.0" y="492" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#191b1c" text-anchor="middle">Data in</text>
<text xml:space="preserve" x="920" y="512.0" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">Files, the ingest folder, connectors and</text>
<text xml:space="preserve" x="920" y="528.5" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">screening lists, through the Conduit</text>
<line x1="908" y1="512" x2="852" y2="386" stroke="#4b4e4e" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="140" y="612" width="1072" height="66" rx="6" fill="#ffffff" stroke="#bbbebf" stroke-width="1.2" stroke-dasharray="6 4"/>
<text xml:space="preserve" x="676.0" y="634" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#191b1c" text-anchor="middle">Outside, only when switched on</text>
<text xml:space="preserve" x="150" y="654.0" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4b4e4e" text-anchor="start">a hosted model provider (only datasets cleared for it) · online map tiles · mail · release updates, signed</text>
<line x1="505" y1="590" x2="505" y2="610" stroke="#4b4e4e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
