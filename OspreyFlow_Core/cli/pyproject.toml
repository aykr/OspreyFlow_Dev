[project]
name = "ospreyflow-cli"
version = "0.1.0"
description = "The ospreyflow command: install, start, stop and look after an OspreyFlow deployment."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
ospreyflow = "ospreyflow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ospreyflow"]
