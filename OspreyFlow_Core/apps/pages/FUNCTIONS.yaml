# The React workspace's function list (ADR-152 Amendment 1, decision 1; slice PL4a).
#
# The GOV.UK tree is *complete* when every row below has its GOV.UK page, less the owner-agreed lines of
# PARITY_EXCEPTIONS.yaml. The state is derived from this file by `govuk_tree_state` in
# `scripts/tree_parity.py` (slice PL7); nothing records "complete" and nobody writes it.
#
# One row per function: the 46 rows of the front-end inventory (`FRONT_END_ANSWERS.md` part B, section 1,
# the owner's file kept outside the repository) and one row for the sign-in page's GOV.UK assets.
#
#   id        a short stable slug
#   name      the inventory's Function cell (the "ADDED" marker the inventory puts before some names is
#             left out: it says the inventory added the row, not what the function is called)
#   where     the inventory's Where cell, with its paths written from the checkout's root
#   slice     the plan's build that owns the page; "none named" where no build owns it yet; where the plan
#             has not yet named a build, the inventory's own slice (R1 to R8) is kept
#   scenario  the spec/08 id or ids, or empty. Only A and B are owner-ruled; scenario C is proposed, so
#             a function with only a C scenario has none here. A function with none gets one before its
#             page is built (decision 12)
#   route     EMPTY until the function has its GOV.UK page: a route enters `tree-govuk`'s route list only
#             with its slice's scenario passing on that tree (I8). A row with a route has a scenario
#   status    planned | owner to rule | parity exception | built
#             `built`: the Default tree's page for the function is built and its scenario passes (the owner's ruling of
#             24 November 2026); its GOV.UK page is a later build, so its route stays empty.
#
# Checked by the developer repository's `tests/glass_trees/test_functions_yaml.py`.
