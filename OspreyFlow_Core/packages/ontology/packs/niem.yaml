# NIEM domain pack (ADR-108 phase D) — the National Information Exchange Model's justice-domain
# shape over the POLE core, which POLE already mirrors. NIEM is published by the US Government as
# a public-domain national standard (https://www.niem.gov/). NIEM Roles — a base entity assuming
# a temporary function (a vehicle as a weapon) — land as role-edges with a validity interval
# (ADR-108 ruling Q4): one hop, the base entity never duplicated.
#
# Version 2 (ADR-117): NIEM's corrections and justice ideas a prison intelligence network is drawn
# from — an incident with a name, category and date, a person's role in one, and the custody links
# an analyst filters by: a shared cell, a co-defendant, a conflict (kept apart), a visit in person
# or by video. Additions only, so nothing a recipe wrote before is refused after.
#
# Version 3 (ADR-120): prison intelligence — an establishment with its NIU area and SOCT region,
# the place links (held at, part of, adjoins, used by, occurred at), the throw-over incident, and
# passes-items-to, the pack's only Probabilistic link, which a recipe can never write. Additions
# only; occurred-at's four optional properties (lat, lon, yard, item_type) were added in place
# (ADR-120 Amendment 7).
pack: niem
pack_version: 3
entity_types:
  - name: Incident
    pole_class: event
    channel: plum
    shape: hexagon
    icon: shield
    identifiers: [incident_ref]
    properties:
      - {name: name, type: string, indexed: true}
      - {name: category, type: enum, values: [assault, disorder, find, other, throw_over]}
      # What was found (a mobile phone, a substance), for a find.
      - {name: item, type: string}
      - {name: occurred_at, type: datetime}
  - name: Establishment
    pole_class: organisation
    channel: azure
    shape: diamond
    icon: building
    identifiers: [establishment_ref]
    properties:
      - {name: name, type: string, required: true, indexed: true}
      - {name: establishment_ref, type: string, required: true, indexed: true}
      - {name: niu_area, type: string, indexed: true}
      - {name: soct_region, type: string, indexed: true}
      - {name: security_category, type: string}
edge_types:
  - name: USED_AS
    from: [Vehicle, Device, Asset, Endpoint]
    to: [Event]
    directed: true
    basis: direct
    temporal: true
    label: Used as
    properties:
      - {name: role, type: string, required: true}
  - name: ROLE_IN
    from: [Person, Organisation]
    to: [Event, Incident]
    directed: true
    basis: direct
    temporal: true
    label: Role in
    properties:
      - {name: role, type: string, required: true}
  # The custody links (ADR-117). Each has its own colour, so a network reads by link type.
  - name: SHARED_CELL_WITH
    from: [Person]
    to: [Person]
    directed: false
    basis: direct
    temporal: true
    label: Shared a cell with
    colour: ochre
    properties:
      - {name: cell, type: string}
  - name: CO_DEFENDANT_OF
    from: [Person]
    to: [Person]
    directed: false
    basis: direct
    label: Co-defendant of
    colour: plum
    properties:
      - {name: case_ref, type: string}
  - name: IN_CONFLICT_WITH
    from: [Person]
    to: [Person]
    directed: false
    basis: direct
    temporal: true
    label: In conflict with
    colour: rose
    properties:
      - {name: reason, type: string}
  - name: VISITED
    from: [Person]
    to: [Person]
    directed: true
    basis: direct
    temporal: true
    label: Visited
    colour: violet
    properties:
      - {name: channel, type: enum, values: [in_person, video]}
  # Where a person is held (ADR-120 D1).
  - name: HELD_AT
    from: [Person]
    to: [Establishment]
    directed: true
    basis: direct
    temporal: true
    label: Held at
    colour: azure
  # A place within a larger place: a landing in a wing, a wing in an establishment.
  - name: PART_OF
    from: [Location]
    to: [Location, Establishment]
    directed: true
    basis: direct
    label: Part of
    colour: moss
  # Two places that share a boundary.
  - name: ADJOINS
    from: [Location]
    to: [Location]
    directed: false
    basis: direct
    label: Adjoins
    colour: cyan
  # A place put to the use of another: a yard used by a wing.
  - name: USED_BY
    from: [Location]
    to: [Location]
    directed: true
    basis: direct
    label: Used by
    colour: moss
  # Where an incident happened.
  - name: OCCURRED_AT
    from: [Incident]
    to: [Location]
    directed: true
    basis: direct
    temporal: true
    label: Occurred at
    colour: jade
    # ADR-120 Amendment 7: an event takes its position from its link, and Trends splits by the
    # properties a link declares; none is required, so a find or an assault carries none.
    properties:
      - {name: lat, type: float}
      - {name: lon, type: float}
      - {name: yard, type: string}
      - {name: item_type, type: string}
  # Items passed from one person to another; inferred, so Probabilistic, never written by a recipe.
  - name: PASSES_ITEMS_TO
    from: [Person]
    to: [Person]
    directed: true
    basis: probabilistic
    temporal: true
    label: Passes items to
    colour: indigo
    properties:
      - {name: channel, type: string}
  # The core's DEPICTS gains Establishment as an end (ADR-120 D1, for the picture of D9), so an
  # establishment carries its own picture.
  - name: DEPICTS
    extends: true
    to: [Establishment]
