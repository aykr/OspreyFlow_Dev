# The Prison Intelligence Dataset (ADR-127 decision 12, R1): the prisoners and where each is held,
# one row per custody record, from the prison service's own record system (NOMIS). Run after R11
# (the establishment plan) has made the establishments. This is the template the other PID recipes
# copy: every entity and link takes its whole marking from the file's six handling columns, the
# custody is a span (an empty `custody_to` is a custody still running), a re-run of the file into one
# case adds nothing (the row keys), and `aliases` is names joined by `|` that `split` turns into the
# list the ontology holds, left out of a prisoner with none (`optional`, ADR-127 Amendment 15).
#
# What this recipe does not write: cells, wings, `PRESENT_AT` and `PART_OF`. A prisoner's cell stays
# are R14's (the cell-stays file) and the places and their `PART_OF` links are R11's (the
# establishment plan), per ADR-127 decision 12; this file has no wing or cell column.
id: pid-nomis-prisoners
version: 1
label: "Prisoners and movements (NOMIS). One row per custody record: a transfer is two rows, and an open custody has no end date."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {niem: 3}

defaults:
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  # Every unit a row's originator or owning-unit cell may name: the file's own.
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: nomis_id}
    - {field: establishment_ref}
    - {field: custody_from, transform: datetime}

row_template:
  entities:
    - ref: prisoner
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id}
        family_name: {field: family_name}
        given_names: {field: given_names}
        date_of_birth: {field: date_of_birth}
        aliases: {field: aliases, transform: split, optional: true}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: establishment
      pole_class: organisation
      type: Establishment
      match_on: establishment_ref
      on_match: reference
      properties:
        establishment_ref: {field: establishment_ref}
      handling: *marking
  edges:
    - type: HELD_AT
      from: prisoner
      to: establishment
      temporal:
        at: {field: custody_from, transform: datetime}
        valid_to: {field: custody_to, transform: datetime}
      handling: *marking

unmapped_fields: []
