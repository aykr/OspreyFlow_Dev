# The Prison Intelligence Dataset (ADR-127 decision 12, R5): the PIN phone calls, one row per call. A
# prisoner is found by reference and uses their PIN account (an `Endpoint` of kind `handle`, made on
# first sight); each call is a `COMMUNICATED_WITH` link from that PIN to the number called, timed at
# `call_start`. The number is read through `msisdn` and matched on its normalised form, exactly as
# R16 does it (`value_normalised` and `e164` both), so every written form of a number (national, +44,
# 0044, bare 44) is one `Endpoint`, and a number a visitor owns is the node R16 made. The duplicate
# key canonicalises every part before it is hashed (`01_DOMAIN_MODEL.md` §7 rule 2): the number
# through `msisdn` and the instant through `datetime`, to the second. So a row copied byte for byte,
# and a repeat of the same call under a new `sequence`, fold into the call they repeat. Run after R16:
# the prisoners and the visitors' numbers are found by reference. The call's `duration_s` is part of
# the key; the plan's call links carry no properties of their own, so neither `duration_s` nor
# `direction` is written onto the link. Copies R1's template: every element takes its whole marking
# from the file's six handling columns.
id: pid-pin-calls
version: 1
label: "PIN phone contacts (BT PIN). One row per call a prisoner made on their PIN account."
connector:
  profile: pin-calls-csv
ontology_version: 17
pack_versions: {}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: pin_account}
    - {field: called_number, transform: msisdn}
    - {field: call_start, transform: datetime}
    - {field: duration_s}

row_template:
  entities:
    - ref: prisoner
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: pin
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: pin_account}
        value_normalised: {field: pin_account}
        handle: {field: pin_account}
        endpoint_kind: {literal: handle}
      handling: *marking
    - ref: number
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: called_number}
        value_normalised: {field: called_number, transform: msisdn}
        e164: {field: called_number, transform: msisdn}
        endpoint_kind: {literal: msisdn}
      handling: *marking
  edges:
    - type: USES
      from: prisoner
      to: pin
      handling: *marking
    - type: COMMUNICATED_WITH
      from: pin
      to: number
      temporal:
        at: {field: call_start, transform: datetime}
      handling: *marking

unmapped_fields:
  - field: direction
    action: ignore
    note: "The plan's call links carry no properties, so a pair's one link holds no direction; every call here is outbound. Bind it when a link is to carry a direction."
  - field: sequence
    action: ignore
    note: "The source's own sequence number for a call. Deliberately not in the duplicate key, so a repeat of a call under a new sequence number folds into the call it repeats."
