# The Prison Intelligence Dataset (ADR-127 decision 12, R2): which prisoners shared a cell, one row per
# pair per week shared. The Studio cannot derive overlaps (rule 8), so the file writer gives one row for
# each week, each pair once in a fixed order, and the link's occurrences are those weeks. Run after R1:
# both people are found by reference. Copies R1's template: every element takes its whole marking from
# the file's six handling columns.
id: pid-nomis-cell-shares
version: 1
label: "Prisoners and movements (NOMIS). One row per pair of prisoners per week they shared a cell."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {niem: 3}

defaults:
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: nomis_id_a}
    - {field: nomis_id_b}
    - {field: week_start, transform: datetime}

row_template:
  entities:
    - ref: first
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id_a}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: second
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id_b}
      handling: *marking
  edges:
    - type: SHARED_CELL_WITH
      from: first
      to: second
      temporal:
        at: {field: week_start, transform: datetime}
      properties:
        cell: {field: cell_ref}
      handling: *marking

unmapped_fields: []
