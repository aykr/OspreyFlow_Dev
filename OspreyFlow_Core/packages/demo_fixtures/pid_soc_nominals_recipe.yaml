# The Prison Intelligence Dataset (ADR-127 decision 12, R12): the organised crime group and which
# prisoners are members of it, one row per member. The first row makes the group (its name and its
# reference); the rest find it, each adding their own `MEMBER_OF` link. `role` is a column the file
# carries, empty in every row, and `MEMBER_OF` has no property for it, so it is named unmapped. Run
# after R1: the prisoners are found by reference. Copies R1's template: every element takes its whole
# marking from the file's six handling columns.
id: pid-soc-nominals
version: 1
label: "Serious and organised crime nominals. One row per prisoner per group they belong to."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: nomis_id}
    - {field: group_ref}

row_template:
  entities:
    - ref: group
      pole_class: organisation
      type: Organisation
      match_on: org_ref
      on_match: reference
      properties:
        org_ref: {field: group_ref}
        name: {field: group_name}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: member
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id}
      handling: *marking
  edges:
    - type: MEMBER_OF
      from: member
      to: group
      handling: *marking

unmapped_fields:
  - field: role
    action: ignore
    note: "MEMBER_OF has no property for a role, and the column is empty in every row. Bind it when the ontology gives the link one."
