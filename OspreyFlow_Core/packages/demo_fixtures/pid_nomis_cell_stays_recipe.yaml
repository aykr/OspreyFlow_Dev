# The Prison Intelligence Dataset (ADR-127 decision 12, R14): where each prisoner has slept, one row per
# cell stay. A stay is a span from `start` to `end`, and an empty `end` is a stay still running
# (ADR-127 decision 11). Run after R1 (the prisoners) and R11 (the cells): both ends are found by
# reference, never made here. Copies R1's template: every element takes its whole marking from the
# file's six handling columns.
id: pid-nomis-cell-stays
version: 1
label: "Prisoners and movements (NOMIS). One row per cell stay: a prisoner in a cell from a start to an end, and no end while the stay runs."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {niem: 3}

defaults:
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: nomis_id}
    - {field: cell_ref}
    - {field: start, transform: datetime}

row_template:
  entities:
    - ref: prisoner
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: cell
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      properties:
        site_ref: {field: cell_ref}
      handling: *marking
  edges:
    - type: PRESENT_AT
      from: prisoner
      to: cell
      temporal:
        at: {field: start, transform: datetime}
        valid_to: {field: end, transform: datetime}
      handling: *marking

unmapped_fields: []
