# The Prison Intelligence Dataset (ADR-127 decision 12, R7): money sent to prisoners' private-cash
# accounts, one row per transfer. Both accounts are `Endpoint`s of kind `account` (not a FIBO
# account), read through `account_ref` (trimmed, upper-cased). The payer is an outside person found
# on their National Insurance number, the key R3 uses for a visitor, so one person is one node
# across the two files (and "one account pays three prisoners" needs no resolution); the payee is a
# prisoner found by prison number. Each person `USES` their own account, and the money is a
# `TRANSACTED` link from the payer's account to the payee's, timed at `transferred_at`, with its
# `amount` and `transaction_type`. A transfer is one row, so its own `transfer_id` is the duplicate
# key. Run after R3. Copies R1's template: every element takes its whole marking from the file's six
# handling columns.
id: pid-prisoner-money
version: 1
label: "Prisoner money. One row per transfer to a prisoner's private-cash account."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {niem: 3}

defaults:
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: transfer_id}

row_template:
  entities:
    - ref: payer
      pole_class: person
      type: Person
      match_on: nino
      on_match: reference
      properties:
        nino: {field: payer_nino}
        family_name: {field: payer_family_name}
        given_names: {field: payer_given_names}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: payee
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: payee_nomis_id}
      handling: *marking
    - ref: payer_account
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: payer_account}
        value_normalised: {field: payer_account, transform: account_ref}
        endpoint_kind: {literal: account}
      handling: *marking
    - ref: payee_account
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: payee_account}
        value_normalised: {field: payee_account, transform: account_ref}
        endpoint_kind: {literal: account}
      handling: *marking
  edges:
    - type: USES
      from: payer
      to: payer_account
      handling: *marking
    - type: USES
      from: payee
      to: payee_account
      handling: *marking
    - type: TRANSACTED
      from: payer_account
      to: payee_account
      temporal:
        at: {field: transferred_at, transform: datetime}
      properties:
        amount: {field: amount}
        transaction_type: {field: transaction_type}
      handling: *marking

unmapped_fields: []
