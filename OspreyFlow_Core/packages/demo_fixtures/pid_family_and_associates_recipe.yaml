# The Prison Intelligence Dataset (ADR-127 decision 12, R13): who is family of whom and who is an
# associate of whom, one row per pair. The `kind` column holds the link type, so there is one edge
# for each kind and each is written only on its own rows. `relation` (brother, cousin and so on) is
# the property of a family link only and is blank on an associate row. Both people are found by
# reference; run after R1. Copies R1's template: every element takes its whole marking from the
# file's six handling columns.
id: pid-family-and-associates
version: 1
label: "Family and associates (NOMIS). One row per pair, either family or associates."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: nomis_id_a}
    - {field: nomis_id_b}
    - {field: kind}

row_template:
  entities:
    - ref: first
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id_a}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: second
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id_b}
      handling: *marking
  edges:
    - type: FAMILY_OF
      from: first
      to: second
      when: {field: kind, equals: FAMILY_OF}
      properties:
        relation: {field: relation}
      handling: *marking
    - type: ASSOCIATE_OF
      from: first
      to: second
      when: {field: kind, equals: ASSOCIATE_OF}
      handling: *marking

unmapped_fields: []
