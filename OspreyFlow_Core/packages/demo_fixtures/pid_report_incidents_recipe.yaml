# The Prison Intelligence Dataset (ADR-127 Amendment 24, R17): which reports mention which incidents,
# one row per report and incident (589 rows). The incident is found by reference on `incident_ref`
# (R4 made the incidents and R10 the throw-overs) and the report `Document` by reference on
# `message_id`, bound to `report_ref` ("IR 0125", Amendment 17), which R9 made; the incident is
# `MENTIONED_IN` the report. Run after R4, R10 and R9, at the chapter-4 moment: a reference that finds
# nothing is the engine's to answer, so the order is the seed's (`pid_files.SEED_ORDER`). Copies R9's
# template: every element takes its whole marking from the file's six handling columns.
id: pid-report-incidents
version: 1
label: "Report incidents. One row per intelligence report and the incident it mentions."
connector:
  profile: generic-csv
ontology_version: 17
pack_versions: {niem: 3}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: incident_ref}
    - {field: report_ref}

row_template:
  entities:
    - ref: incident
      pole_class: event
      type: Incident
      match_on: incident_ref
      on_match: reference
      properties:
        incident_ref: {field: incident_ref}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: report
      pole_class: object
      type: Document
      match_on: message_id
      on_match: reference
      properties:
        message_id: {field: report_ref}
      handling: *marking
  edges:
    - type: MENTIONED_IN
      from: incident
      to: report
      handling: *marking

unmapped_fields: []
