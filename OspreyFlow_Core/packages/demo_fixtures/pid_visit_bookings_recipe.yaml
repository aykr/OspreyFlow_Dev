# The Prison Intelligence Dataset (ADR-127 Amendment 41, R18; use case P2): the week's visit bookings,
# one row per booking. A booking is a record, not a visit: it is a `Document` found or made on its
# booking reference (`message_id`), titled with the visit's day and time, dated when the booking was
# made (`sent_at`), and the visitor, the prisoner and the contact number the visitor gave are each
# `MENTIONED_IN` it. No `VISITED` is written: the visit has not happened. So every link a load writes
# is new (the booking is new), and the rehearsal reset can revert the load (ADR-127 decision 6).
#   - the visitor is found by National Insurance number (R3 made them), with their names should a
#     booking ever name someone the case has not met;
#   - the prisoner is found by prison number (R1 made them);
#   - the contact number is read through `msisdn` and matched on its normalised form, as R16 does, so
#     the number a hotlist holds is the node the booking names, and a hotlist on it is shown the load
#     (ADR-127 decision 7(a)): P2's alert is raised as the bookings load, before the visit.
# Run after R1, R3 and R16. Copies R1's template: every element takes its whole marking from the
# file's six handling columns.
id: pid-visit-bookings
version: 1
label: "Visit bookings. One row per booking: the visitor, the prisoner, when, and the contact number given."
connector:
  profile: generic-csv
ontology_version: 17
pack_versions: {}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: booking_ref}

row_template:
  entities:
    - ref: booking
      pole_class: object
      type: Document
      match_on: message_id
      on_match: reference
      properties:
        message_id: {field: booking_ref}
        title: {field: title}
        sent_at: {field: booked_at}
        document_kind: {literal: other}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: visitor
      pole_class: person
      type: Person
      match_on: nino
      on_match: reference
      properties:
        nino: {field: visitor_nino}
        family_name: {field: visitor_family_name}
        given_names: {field: visitor_given_names, optional: true}
      handling: *marking
    - ref: prisoner
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id}
      handling: *marking
    - ref: contact
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: contact_number}
        value_normalised: {field: contact_number, transform: msisdn}
        e164: {field: contact_number, transform: msisdn}
        endpoint_kind: {literal: msisdn}
      handling: *marking
  edges:
    - type: MENTIONED_IN
      from: visitor
      to: booking
      handling: *marking
    - type: MENTIONED_IN
      from: prisoner
      to: booking
      handling: *marking
    - type: MENTIONED_IN
      from: contact
      to: booking
      handling: *marking

unmapped_fields:
  - field: visit_at
    action: ignore
    note: "The booked visit's date and time, carried in the booking's title. Not a link time: the visit has not happened, and no VISITED is written for a booking."
  - field: channel
    action: ignore
    note: "In person or by video, carried in the booking's title."
