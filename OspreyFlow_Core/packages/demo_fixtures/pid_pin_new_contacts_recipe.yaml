# The Prison Intelligence Dataset (ADR-127 Amendment 41, R19; use case P1): the PIN supplier's weekly
# first-contact extract, one row per call an account made to a number it had not called before, in
# the call log's own columns (R5's). Each call is a `COMMUNICATED_WITH` link from the PIN account to
# the number, timed at `call_start`. The account is found by reference: R5 has already tied it to its
# prisoner, so this recipe writes no `USES` (writing it again would merge into R5's link, and the
# rehearsal reset could not revert the load: ADR-127 decision 6). The number is read through
# `msisdn` and matched on its normalised form, exactly as R5 and R16 do. The duplicate key is R5's.
# The case's rule "a number on a seized handset" (P1) judges each load after it commits, as the
# pipeline's "Checks on load" step attaches it (ADR-133 decision 6). Run after R5 and R6 batch 1.
# Copies R5's template: every element takes its whole marking from the file's six handling columns.
id: pid-pin-new-contacts
version: 1
label: "PIN phone first contacts (weekly). One row per call an account made to a number it had not called before."
connector:
  profile: pin-calls-csv
ontology_version: 17
pack_versions: {}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: pin_account}
    - {field: called_number, transform: msisdn}
    - {field: call_start, transform: datetime}
    - {field: duration_s}

row_template:
  entities:
    - ref: pin
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: pin_account}
        value_normalised: {field: pin_account}
        handle: {field: pin_account}
        endpoint_kind: {literal: handle}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: number
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: called_number}
        value_normalised: {field: called_number, transform: msisdn}
        e164: {field: called_number, transform: msisdn}
        endpoint_kind: {literal: msisdn}
      handling: *marking
  edges:
    - type: COMMUNICATED_WITH
      from: pin
      to: number
      temporal:
        at: {field: call_start, transform: datetime}
      handling: *marking

unmapped_fields:
  - field: nomis_id
    action: ignore
    note: "The account's prisoner. R5 tied every account to its prisoner; this extract only adds first contacts, so it writes no USES (which would merge into R5's link)."
  - field: direction
    action: ignore
    note: "Every call here is outbound, as in R5."
  - field: sequence
    action: ignore
    note: "The extract's own row number, not in the duplicate key, as in R5."
