# The Prison Intelligence Dataset (ADR-127 decision 12, R8): who was a co-defendant of whom, one row
# per pair, with the case. The extract is partial and says so in the label, which the Studio shows
# beside every link it wrote: a missing link here does not mean there is none. Both people are found
# by reference; run after R1. Copies R1's template: every element takes its whole marking from the
# file's six handling columns.
id: pid-codefendants
version: 1
label: "Co-defendants (court case extract). Partial: a missing link here does not mean no link."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {niem: 3}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: nomis_id_a}
    - {field: nomis_id_b}
    - {field: case_ref}

row_template:
  entities:
    - ref: first
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id_a}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: second
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id_b}
      handling: *marking
  edges:
    - type: CO_DEFENDANT_OF
      from: first
      to: second
      properties:
        case_ref: {field: case_ref}
      handling: *marking

unmapped_fields: []
