# The Prison Intelligence Dataset (ADR-127 decision 12, R6): the communications found on seized
# handsets, one row per communication. One recipe serves both files: batch 1 is loaded by the seed and
# batch 2 (`incoming/`) is loaded at chapter 9. The handset is a `Device` read through `imei`, the SIM
# an `Endpoint` of kind `imsi` read through `imsi` (a SIM, never a number, is paired with a handset),
# and the other party an `Endpoint` of kind `msisdn` read through `msisdn` exactly as R5 and R16 do. A
# prisoner `USES` the handset when the row says who it was found with (`found_with_nomis_id`; a
# handset found with no one has an empty cell and no prisoner and no link), at `found_on`. Each
# communication is a `COMMUNICATED_WITH` link from the SIM, timed at `occurred_at`; a call and a text
# are the same kind of link, told apart in the duplicate key by `kind`. Run after R1 and R16. Copies
# R1's template: every element takes its whole marking from the file's six handling columns.
id: pid-seized-comms
version: 1
label: "Seized media. One row per communication found on a seized handset."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: imei, transform: imei}
    - {field: imsi, transform: imsi}
    - {field: other_number, transform: msisdn}
    - {field: occurred_at, transform: datetime}
    - {field: kind}

row_template:
  entities:
    - ref: handset
      pole_class: object
      type: Device
      match_on: imei
      on_match: reference
      properties:
        imei: {field: imei, transform: imei}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: sim
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: imsi}
        value_normalised: {field: imsi, transform: imsi}
        imsi: {field: imsi, transform: imsi}
        endpoint_kind: {literal: imsi}
      handling: *marking
    - ref: other
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: other_number}
        value_normalised: {field: other_number, transform: msisdn}
        e164: {field: other_number, transform: msisdn}
        endpoint_kind: {literal: msisdn}
      handling: *marking
    - ref: finder
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      when: {field: found_with_nomis_id, is: not_null}
      properties:
        prison_number: {field: found_with_nomis_id}
      handling: *marking
  edges:
    - type: PAIRED_WITH
      from: sim
      to: handset
      handling: *marking
    - type: COMMUNICATED_WITH
      from: sim
      to: other
      temporal:
        at: {field: occurred_at, transform: datetime}
      handling: *marking
    - type: USES
      from: finder
      to: handset
      when: {field: found_with_nomis_id, is: not_null}
      temporal:
        at: {field: found_on, transform: datetime}
      handling: *marking

unmapped_fields:
  - field: duration_s
    action: ignore
    note: "The plan's communication links carry no properties, and a text has no duration, so none is written onto a pair's one link. Bind it when a link is to carry a duration."
