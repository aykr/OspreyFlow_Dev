# The Prison Intelligence Dataset (ADR-127 decision 12, R11): the places, one row per place of any
# kind (an establishment, a zone, a visits hall, a wing, a landing, a cell, a yard, an outside place),
# from the estates record. Run first: every other recipe finds its establishments and places here, so
# R1 relies on the `name` an establishment gets here. A kind is told by `place_kind` (a `when` on each
# kind's entity) and a link's parent by `parent_kind`; a link is written only when both of its ends
# exist on the row, so a cell has its landing, a landing its wing, a wing or a yard or a hall its
# establishment, and a wing or a yard its zone, a yard the wing it adjoins and the wing that uses it.
# A point (`lat`, `lon`) becomes the place's `geometry_ref` where the row has one. The file writes
# every place before any row that names it (a parent, a zone, the wing a yard adjoins or is used by),
# so a reference finds it whole: a reference that finds nothing makes a bare node, and the place's own
# row would then find that and never write its name and point. `test_pid_files.py` holds that order.
#
# Copies R1's template: every element takes its whole marking from the file's six handling columns.
id: pid-establishment-plan
version: 1
label: "Establishment plan (estates). One row per place: the establishments, wings, landings, cells, yards, halls and zones of the prison estate, and how they fit together."
connector:
  profile: generic-csv
  source_crs: "EPSG:4326"
ontology_version: 16
pack_versions: {niem: 3}

defaults:
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: place_ref}

row_template:
  entities:
    - ref: establishment
      pole_class: organisation
      type: Establishment
      match_on: establishment_ref
      on_match: reference
      when: {field: place_kind, equals: establishment}
      properties:
        establishment_ref: {field: place_ref}
        name: {field: name}
        niu_area: {field: niu_area, optional: true}
        soct_region: {field: soct_region, optional: true}
        security_category: {field: security_category, optional: true}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: wing
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: place_kind, equals: wing}
      properties:
        site_ref: {field: place_ref}
        name: {field: name}
        geometry_ref: {fields: [lon, lat], transform: geometry_ref, optional: true}
      handling: *marking
    - ref: landing
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: place_kind, equals: landing}
      properties:
        site_ref: {field: place_ref}
        name: {field: name}
        geometry_ref: {fields: [lon, lat], transform: geometry_ref, optional: true}
      handling: *marking
    - ref: cell
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: place_kind, equals: cell}
      properties:
        site_ref: {field: place_ref}
        name: {field: name}
        geometry_ref: {fields: [lon, lat], transform: geometry_ref, optional: true}
      handling: *marking
    - ref: yard
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: place_kind, equals: yard}
      properties:
        site_ref: {field: place_ref}
        name: {field: name}
        geometry_ref: {fields: [lon, lat], transform: geometry_ref, optional: true}
      handling: *marking
    - ref: zone
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: place_kind, equals: zone}
      properties:
        site_ref: {field: place_ref}
        name: {field: name}
        geometry_ref: {fields: [lon, lat], transform: geometry_ref, optional: true}
      handling: *marking
    - ref: hall
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: place_kind, equals: hall}
      properties:
        site_ref: {field: place_ref}
        name: {field: name}
        geometry_ref: {fields: [lon, lat], transform: geometry_ref, optional: true}
      handling: *marking
    - ref: place
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: place_kind, equals: place}
      properties:
        site_ref: {field: place_ref}
        name: {field: name}
        geometry_ref: {fields: [lon, lat], transform: geometry_ref, optional: true}
      handling: *marking
    - ref: parent_establishment
      pole_class: organisation
      type: Establishment
      match_on: establishment_ref
      on_match: reference
      when: {field: parent_kind, equals: establishment}
      properties:
        establishment_ref: {field: parent_ref}
      handling: *marking
    - ref: parent_wing
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: parent_kind, equals: wing}
      properties:
        site_ref: {field: parent_ref}
      handling: *marking
    - ref: parent_landing
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: parent_kind, equals: landing}
      properties:
        site_ref: {field: parent_ref}
      handling: *marking
    - ref: zone_of
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: parent_ref_2, is: not_null}
      properties:
        site_ref: {field: parent_ref_2}
      handling: *marking
    - ref: adjoined_wing
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: adjoins_ref, is: not_null}
      properties:
        site_ref: {field: adjoins_ref}
      handling: *marking
    - ref: used_by_wing
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: used_by_ref, is: not_null}
      properties:
        site_ref: {field: used_by_ref}
      handling: *marking
  edges:
    - type: PART_OF
      from: cell
      to: parent_landing
      handling: *marking
    - type: PART_OF
      from: landing
      to: parent_wing
      handling: *marking
    - type: PART_OF
      from: wing
      to: parent_establishment
      handling: *marking
    - type: PART_OF
      from: yard
      to: parent_establishment
      handling: *marking
    - type: PART_OF
      from: hall
      to: parent_establishment
      handling: *marking
    - type: PART_OF
      from: wing
      to: zone_of
      handling: *marking
    - type: PART_OF
      from: yard
      to: zone_of
      handling: *marking
    - type: ADJOINS
      from: yard
      to: adjoined_wing
      handling: *marking
    - type: USED_BY
      from: yard
      to: used_by_wing
      handling: *marking

unmapped_fields: []
