# The Prison Intelligence Dataset (ADR-127 Amendment 22, R9): the intelligence reports, one row per
# report. The report is a `Document` matched on `message_id`, bound to `report_ref` ("IR 0125", Amendment
# 17), and made on first sight with its title, its time (`submitted_at`, an ISO date-time the property takes as it stands, as R4's `occurred_at` is), its kind
# (`category`) and its own text from `report_text` (decision 1: the `Document` holds the text itself, no
# content node; the engine sets `media_kind` text and `object_ref` itself, and a recipe may not bind
# either). The reports and what they name are chapter 4's. Each report names up
# to three areas, up to three people and one number, and each is `MENTIONED_IN` the report:
#   - the areas are found by reference on their place reference, as R4 does; the second and third are
#     gated on not-null;
#   - a prisoner is found by reference on `prison_number` in `subject_N`, gated on not-null; an outside
#     person is found or made on `nino` in `subject_N_nino` (ADR-120 Amendment 15), gated on not-null,
#     with their names and date of birth (`family_name` is required by `Person`, so it is bound plain;
#     `given_names` and `date_of_birth` are optional), so a prisoner slot never makes a `Person`
#     from a National Insurance number;
#   - the number is `phone_mentioned`, gated on not-null, an outside `Endpoint` read through `msisdn`
#     and matched on its normalised form, as R16 does. A cell `msisdn` refuses (row 17's `07700 900 6O3`)
#     rejects that row alone, naming the column and the cause.
# Run after R11, R1, R3 and R16 (the areas, the prisoners, the visitors and the numbers it finds by
# reference). Copies R1's template: every element takes its whole marking from the file's six handling
# columns.
id: pid-intel-reports
version: 1
label: "Intelligence reports. One row per report: its text, the areas it is set in, the people it names and any number it gives."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {niem: 3}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: report_ref}

row_template:
  entities:
    - ref: report
      pole_class: object
      type: Document
      match_on: message_id
      on_match: reference
      properties:
        message_id: {field: report_ref}
        title: {field: title}
        sent_at: {field: submitted_at}
        document_kind: {field: category}
      content: {kind: document_text, field: report_text}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: area_1
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      properties:
        site_ref: {field: area_ref}
      handling: *marking
    - ref: area_2
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: area_ref_2, is: not_null}
      properties:
        site_ref: {field: area_ref_2}
      handling: *marking
    - ref: area_3
      pole_class: location
      type: Location
      match_on: site_ref
      on_match: reference
      when: {field: area_ref_3, is: not_null}
      properties:
        site_ref: {field: area_ref_3}
      handling: *marking
    - ref: prisoner_1
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      when: {field: subject_1, is: not_null}
      properties:
        prison_number: {field: subject_1}
      handling: *marking
    - ref: prisoner_2
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      when: {field: subject_2, is: not_null}
      properties:
        prison_number: {field: subject_2}
      handling: *marking
    - ref: prisoner_3
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      when: {field: subject_3, is: not_null}
      properties:
        prison_number: {field: subject_3}
      handling: *marking
    - ref: outsider_1
      pole_class: person
      type: Person
      match_on: nino
      on_match: reference
      when: {field: subject_1_nino, is: not_null}
      properties:
        nino: {field: subject_1_nino}
        family_name: {field: subject_1_family_name}
        given_names: {field: subject_1_given_names, optional: true}
        date_of_birth: {field: subject_1_date_of_birth, optional: true}
      handling: *marking
    - ref: outsider_2
      pole_class: person
      type: Person
      match_on: nino
      on_match: reference
      when: {field: subject_2_nino, is: not_null}
      properties:
        nino: {field: subject_2_nino}
        family_name: {field: subject_2_family_name}
        given_names: {field: subject_2_given_names, optional: true}
        date_of_birth: {field: subject_2_date_of_birth, optional: true}
      handling: *marking
    - ref: outsider_3
      pole_class: person
      type: Person
      match_on: nino
      on_match: reference
      when: {field: subject_3_nino, is: not_null}
      properties:
        nino: {field: subject_3_nino}
        family_name: {field: subject_3_family_name}
        given_names: {field: subject_3_given_names, optional: true}
        date_of_birth: {field: subject_3_date_of_birth, optional: true}
      handling: *marking
    - ref: number
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      when: {field: phone_mentioned, is: not_null}
      properties:
        value_raw: {field: phone_mentioned}
        value_normalised: {field: phone_mentioned, transform: msisdn}
        e164: {field: phone_mentioned, transform: msisdn}
        endpoint_kind: {literal: msisdn}
      handling: *marking
  edges:
    - type: MENTIONED_IN
      from: area_1
      to: report
      handling: *marking
    - type: MENTIONED_IN
      from: area_2
      to: report
      when: {field: area_ref_2, is: not_null}
      handling: *marking
    - type: MENTIONED_IN
      from: area_3
      to: report
      when: {field: area_ref_3, is: not_null}
      handling: *marking
    - type: MENTIONED_IN
      from: prisoner_1
      to: report
      when: {field: subject_1, is: not_null}
      handling: *marking
    - type: MENTIONED_IN
      from: prisoner_2
      to: report
      when: {field: subject_2, is: not_null}
      handling: *marking
    - type: MENTIONED_IN
      from: prisoner_3
      to: report
      when: {field: subject_3, is: not_null}
      handling: *marking
    - type: MENTIONED_IN
      from: outsider_1
      to: report
      when: {field: subject_1_nino, is: not_null}
      handling: *marking
    - type: MENTIONED_IN
      from: outsider_2
      to: report
      when: {field: subject_2_nino, is: not_null}
      handling: *marking
    - type: MENTIONED_IN
      from: outsider_3
      to: report
      when: {field: subject_3_nino, is: not_null}
      handling: *marking
    - type: MENTIONED_IN
      from: number
      to: report
      when: {field: phone_mentioned, is: not_null}
      handling: *marking

unmapped_fields:
  - field: subject_1_role
    action: ignore
    note: "Empty in every row: the plan holds no role for a person a report names, and MENTIONED_IN has no role property. Bind it when a link is to carry a role."
  - field: subject_2_role
    action: ignore
    note: "Empty in every row: the plan holds no role for a person a report names, and MENTIONED_IN has no role property. Bind it when a link is to carry a role."
  - field: subject_3_role
    action: ignore
    note: "Empty in every row: the plan holds no role for a person a report names, and MENTIONED_IN has no role property. Bind it when a link is to carry a role."
  - field: reviewer_initials
    action: ignore
    note: "Brief 2 section 5's teaching extra column: the reviewer's initials are no part of the report or what it names, so the load ignores them."
