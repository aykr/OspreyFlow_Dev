# The Prison Intelligence Dataset (ADR-127 decision 12, R15): which prisoners are in conflict, one row
# per sighting, so a link's occurrences are the sightings and its interval the first and last. One
# link in the file is SECRET (a covert source's report), at a marking of its own: every element takes
# its whole marking from the six handling columns, so that row loads as SECRET whatever the default
# says. Both people are found by reference; run after R1. Copies R1's template.
id: pid-nomis-conflicts
version: 1
label: "Conflicts (NOMIS). One row per sighting of a conflict between two prisoners."
connector:
  profile: generic-csv
ontology_version: 16
pack_versions: {niem: 3}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: nomis_id_a}
    - {field: nomis_id_b}
    - {field: first_seen, transform: datetime}

row_template:
  entities:
    - ref: first
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id_a}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: second
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id_b}
      handling: *marking
  edges:
    - type: IN_CONFLICT_WITH
      from: first
      to: second
      temporal:
        at: {field: first_seen, transform: datetime}
      properties:
        reason: {field: reason}
      handling: *marking

unmapped_fields: []
