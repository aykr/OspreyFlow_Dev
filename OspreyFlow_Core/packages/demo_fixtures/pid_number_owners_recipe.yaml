# The Prison Intelligence Dataset (ADR-127 decision 12, R16): the one outside number each visitor owns,
# the coordinator's among them, one row per owner. The owner is found by their National Insurance
# number (R3 made them). The number is read through `msisdn`, so every written form of it (national,
# +44, 0044, bare 44) is one `Endpoint`, matched on its normalised form and made on first sight with
# the form it was first written in as its raw value. Run after R3. Copies R1's template: every element
# takes its whole marking from the file's six handling columns.
id: pid-number-owners
version: 1
label: "Number owners. One row per visitor and the outside number they own."
connector:
  profile: generic-csv
ontology_version: 17
pack_versions: {}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: owner_ref}
    - {field: number, transform: msisdn}

row_template:
  entities:
    - ref: owner
      pole_class: person
      type: Person
      match_on: nino
      on_match: reference
      properties:
        nino: {field: owner_ref}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: number
      pole_class: object
      type: Endpoint
      match_on: value_normalised
      on_match: reference
      properties:
        value_raw: {field: number}
        value_normalised: {field: number, transform: msisdn}
        e164: {field: number, transform: msisdn}
        endpoint_kind: {literal: msisdn}
      handling: *marking
  edges:
    - type: USES
      from: owner
      to: number
      handling: *marking

unmapped_fields: []
