# The Prison Intelligence Dataset (ADR-127 decision 12, R3): who visited whom, one row per visit. A
# visitor is matched on their National Insurance number (the same key the prisoner-money file uses for
# a payer, so one outside person is one node across the two), made on first sight with their names and
# date of birth, and given the aliases the file carries (`visitor_aliases`, names joined by `|`, left out
# of a visitor with none). Run after R1: the prisoner is found by reference. Copies R1's template: every
# element takes its whole marking from the file's six handling columns.
id: pid-nomis-visits
version: 1
label: "Visits and incidents (NOMIS). One row per visit: a visitor, the prisoner visited, the date and whether it was in person or by video."
connector:
  profile: generic-csv
ontology_version: 17
pack_versions: {niem: 3}

defaults:
  legal_basis: Synthetic demonstration data
  provenance: {state: asserted}
  handling:
    classification: OFFICIAL
    handling_code: P
    originator: fenwick-moor-security
    owning_unit: fenwick-moor-security
  units: [fenwick-moor-security, regional-intel-unit]
  handling_columns:
    classification: classification
    handling_code: handling_code
    action_code: action_code
    sanitisation_code: sanitisation_code
    originator: originator
    owning_unit: owning_unit

deduplicate:
  key:
    - {field: visit_ref}

row_template:
  entities:
    - ref: visitor
      pole_class: person
      type: Person
      match_on: nino
      on_match: reference
      properties:
        nino: {field: visitor_nino}
        family_name: {field: visitor_family_name}
        given_names: {field: visitor_given_names}
        date_of_birth: {field: visitor_date_of_birth}
        aliases: {field: visitor_aliases, transform: split, optional: true}
      handling: &marking
        classification: {field: classification}
        handling_code: {field: handling_code}
        action_code: {field: action_code}
        sanitisation_code: {field: sanitisation_code}
        originator: {field: originator}
        owning_unit: {field: owning_unit}
    - ref: prisoner
      pole_class: person
      type: Person
      match_on: prison_number
      on_match: reference
      properties:
        prison_number: {field: nomis_id}
      handling: *marking
  edges:
    - type: VISITED
      from: visitor
      to: prisoner
      temporal:
        at: {field: visit_date, transform: datetime}
      properties:
        channel: {field: channel}
      handling: *marking

unmapped_fields: []
