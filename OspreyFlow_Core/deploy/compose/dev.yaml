# `make dev-up` — process/07_BUILD_PLAN.md Phase 3: "Add make dev-up bringing
# up ArcadeDB, MinIO, Valkey and Postgres so the full suite runs locally.
# The 49 [and now more] currently-skipped tests should be runnable on
# demand, not only in CI."
#
# This is a dev convenience, not the harness (spec/05_DEPLOYMENT.md §2):
# the harness is a browser application that generates a deployment's real
# compose file from `osprey.yaml` and stands up the full local-lite stack
# (twelve containers, including Keycloak, OpenSearch, Ollama...) — it does
# not exist until Phase 8. This file exists only to run the test suite
# locally, and stands up exactly the four stores the code already talks
# to this phase, on the same ports and credentials every client already
# defaults to (`packages/adapters/graph_arcadedb/client.py`,
# `services/ingest/staging.py`, `services/api/config.py`), so `make
# dev-up && make test-all` needs no env configuration. Postgres is the one
# exception: it publishes on 5433, not its usual 5432, because a native
# Postgres already bound to 127.0.0.1:5432 on some dev machines silently
# intercepts connections meant for this container — `services/api/config.py`
# defaults to 5433 to match, so no env configuration is still needed.
services:
  arcadedb:
    # ADR-101: 26.10.1, with Gremlin on its Groovy engine (see `harness/render.py`).
    image: arcadedata/arcadedb:26.10.1
    ports:
      - "2480:2480"
    environment:
      JAVA_OPTS: "-Darcadedb.server.rootPassword=playwithdata123 -Darcadedb.gremlin.engine=groovy"
      # Unset, the image's own default heap is ~25% of the memory Docker
      # exposes to the container (JVM ergonomics, not a value this image
      # hardcodes) — around 2GB on this machine's ~7.6GB Docker VM, which
      # is what OOM'd under two concurrent full conformance-suite runs.
      # 4GB is an explicit, reproducible floor well above the ~2GB a
      # single sequential run needs (measured: 44/44 pass repeatedly at
      # the unset default), giving real headroom for lighter concurrent
      # load during local development. It does NOT fully eliminate OOM
      # under two full 44-test suites run at the same time on this
      # machine — that was re-tested up to -Xmx7G (near this Docker
      # Desktop VM's entire 7.6GB budget) and still failed, just less
      # often; the residual cause is the VM's own memory ceiling, not
      # this value. Running two full suites concurrently reliably needs
      # Docker Desktop's VM memory allocation raised (Settings →
      # Resources → Memory, a host setting, not this file) beyond this
      # host's current ~7.6GB.
      #
      # Raised to 6G in Phase 5 (07_BUILD_PLAN.md): a single sequential
      # run of the HMP fixture's graph side (tests/scenarios/
      # fixtures/hmp_graph.py — ~400 Person nodes, their cells, and ~1,700
      # edges) OOM'd at 4G on this host on every attempt, including at
      # container startup before any client request — a different case
      # from the two-concurrent-suites stress test above (one sequential
      # run, not two concurrent ones), so the note above's "still failed
      # at 7G" does not apply here. The other three dev containers
      # combined use under 1GB, so 6G leaves real headroom in the
      # existing ~7.6GB budget without needing that budget raised.
      #
      # Phase 6 (07_BUILD_PLAN.md) added a fourth, heavier neighbour this budget did not
      # previously have to share with: `ollama`, which idles around 3.5GB with a model loaded
      # (`docker stats`, this host). Reproduced directly, not assumed: with `ollama` up (its
      # ordinary Stage 1+ resting state, not under load), this container OOM-killed (exit 137)
      # repeatedly under Stage 6's live end-to-end scenario test and the full live conformance
      # suite — sometimes within seconds of its own startup/recovery, before any client request —
      # on this same ~7.6GB Docker Desktop VM the two notes above already describe as tight. This
      # is a fourth distinct stress case from the two already on file (two concurrent
      # ArcadeDB-only suites; one heavy sequential ArcadeDB-only HMP build): cross-container
      # contention with `ollama`'s own resting footprint, not ArcadeDB's own workload size. Same
      # underlying cause as both prior notes — this host's total VM budget, not this container's
      # own `-Xmx` value — so raising `-Xmx` further is not expected to help on its own; running
      # the live Phase 6 scenario/conformance tests reliably on this host needs either Docker
      # Desktop's VM memory allocation raised beyond ~7.6GB (Settings → Resources → Memory) or
      # `ollama` stopped first. Restarting this container (`docker start arcadedb` /
      # `compose-arcadedb-1`) after a kill recovers cleanly in the memory-pressure case above; no
      # data loss was observed across several repeated kills during Stage 6 development. It does
      # NOT recover from the disk-exhaustion case the next note describes — that needs the stale
      # databases actually removed first.
      #
      # A fourth, distinct failure mode, found during the ADR-023 migration (18 September 2026):
      # `testing.py`'s (`packages/adapters/graph_arcadedb/testing.py`) per-test database teardown
      # runs in a `finally` block, which cannot fire across a hard kill of the test process or
      # this container. Three `conformance_*` databases orphaned by an earlier interrupted run
      # (~3.5GB) had accumulated here undetected, and this container's own disk (Docker Desktop's
      # VM disk, not host disk — checked directly, the host had hundreds of GB free) filled
      # ("No space left on device" from `LocalSchema.close`), then a plain restart made it worse:
      # ArcadeDB tried to reload every accumulated database at startup and OOM'd before serving a
      # single request. Recovery needed the orphaned `conformance_*` directories deleted from the
      # server's own `databases` volume directly, not a container restart — real data (the
      # `ospreyflow` database) was identified and left untouched by name, not by guessing. This is
      # now self-healing going forward: `packages/adapters/graph_arcadedb/testing.py`'s
      # `sweep_stale_conformance_databases`, run once per session from `tests/conformance/
      # graph_port/conftest.py`, drops any `conformance_*` orphan before the suite starts — it
      # does not prevent a hard kill from orphaning one, only stops orphans from compounding
      # silently across sessions. The sweep's own first cut dropped every `conformance_*`
      # database unconditionally, which is unsafe under the artificial two-concurrent-process
      # stress case Phase 1's own known-gap already names above (session B's sweep would drop
      # session A's still-running database mid-test) — fixed by encoding a creation timestamp
      # into the database name and only sweeping past a staleness window; `testing.py`'s own
      # docstring has the full reasoning and the measurements the window is set from.
      #
      # **Round 13bb, 27 September 2026 — 6G was not enough and was not derived from anything
      # current.** A full `make test-all` on this host OOM'd the server outright at 50%:
      #
      #     ArcadeDB Server started in 'development' mode (CPUs=12 MAXRAM=6.00GB)
      #     java.lang.OutOfMemoryError: Java heap space
      #     Dumping heap to java_pid1.hprof ... [3064364881 bytes in 1.375 secs]
      #     Exception in thread "ArcadeDB TransactionManager ospreyflow" java.lang.OutOfMemoryError
      #     SEVER Error on creating index on type 'mx_COMMUNICATED_WITH', properties [owning_unit]
      #
      # `07_BUILD_PLAN.md` Stage 2a had recorded that last line as the failure for two rounds. It
      # is the symptom; the cause is the line above it, and nobody had read the server's own log.
      # Note the two databases named in the OOM: a `conformance_*` one and the long-lived
      # `ospreyflow` one, both resident in the same heap — `test_hmp_graph.py` seeds ~400 Person
      # nodes and ~1,700 edges into the latter immediately before the failing tests.
      #
      # **Raising the heap was measured NOT to be the fix** — recorded here because the next
      # person to see an ArcadeDB OOM will reach for it first. At `-Xmx6G` the full suite OOM'd at
      # 50%; at `-Xmx8G`, at 53%; bounding `arcadedb.dbPageCacheSize` to 512MiB changed nothing.
      # The cause was per-database-lifecycle retention in ArcadeDB **24.11.1**: five bare
      # create -> apply_schema -> drop cycles, writing no data, took the server from 141.7MiB to
      # 8.2GiB and a drop returned none of it. **Fixed upstream in 25.5.1**, which is why the pin
      # above moved: the identical reproduction plateaus at ~1.5GiB and stays there (1.499GiB at 5
      # cycles, 1.516GiB at 20). The pin is the fix; this heap value is right on its own merits.
      #
      # **This value is now derived, in `harness/profiles.py`, from the profile's own 16GB memory
      # floor** (`05_DEPLOYMENT.md` §1/§3), at a stated fraction — so it moves if the floor does,
      # which a literal cannot. The literal below is kept in step by
      # `tests/harness/test_dev_compose_arcadedb_heap.py`, which fails if these two paths drift
      # again; drifting apart is exactly what happened last time (the renderer never picked up
      # this file's own Phase 5 raise, and a rendered deployment was left worse-configured than
      # the dev stack it replaces).
      #
      # `-XX:+ExitOnOutOfMemoryError` is the other half of the finding, and it is not tuning:
      # measured directly after the OOM above, `docker inspect` still reported this container
      # `healthy` and `GET /api/v1/ready` still answered 204, with both databases' transaction
      # and flush threads dead. The readiness endpoint survives a heap OOM, so the healthcheck
      # cannot see one — which is how "7.22 GiB with the container reporting healthy" got written
      # down as a puzzle rather than as a dead JVM. Exiting makes it visible.
      ARCADEDB_OPTS_MEMORY: "-Xms1G -Xmx8G -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      # `wget`, not `curl`: ArcadeDB 26.10.1's image has no `curl` (ADR-101).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2480/api/v1/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  objectstore:
    # ADR-114 Amendment 9: MinIO's public images were withdrawn; SeaweedFS (Apache-2.0), with the
    # settings `harness/render.py` gives a deployment. Published on 9000 with the development
    # credentials, so every `MINIO_*` default (`localhost:9000`, `minioadmin`) still reaches it.
    image: chrislusf/seaweedfs:4.48
    command: >-
      server -s3 -dir=/data -s3.port=8333 -volume.max=1000
      -master.volumeSizeLimitMB=1024 -master.volumePreallocate=false
    ports:
      - "9000:8333"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:8.0
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    ports:
      # Host side is 5433, not Postgres's usual 5432 — see this file's
      # header comment. Container-internal port is unchanged.
      - "5433:5432"
    environment:
      POSTGRES_USER: osprey
      POSTGRES_PASSWORD: playwithdata123
      POSTGRES_DB: ospreyflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osprey -d ospreyflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ModelPort's backend (process/07_BUILD_PLAN.md Phase 6 Stage 1) — the model
  # itself is pinned by digest, not by tag (spec/06_DECISIONS.md ADR-020):
  # an Ollama tag can move upstream and silently reintroduce the
  # nondeterminism the pin exists to rule out. The base image is pinned by
  # digest directly, the same way `litellm` below is; the model weights
  # cannot be, since Ollama's own CLI (tested against 0.18.2) rejects
  # `ollama pull <name>@sha256:...` for a library model with a
  # "400 Bad Request: invalid model name" — ADR-020 records this in full.
  # The pin is enforced here the other way round: pull the tag, then check
  # the resulting local manifest's digest (`ollama list`'s own "ID" column
  # — confirmed to be exactly this digest's first 12 hex characters) against
  # the one recorded here, refusing to serve on a mismatch rather than
  # silently running whatever the tag now resolves to.
  ollama:
    image: ollama/ollama@sha256:5a5d014aa774f78ebe1340c0d4afc2e35afc12a2c3b34c84e71f78ea20af4ba3
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    # Three models, all pinned and verified the same way: `qwen2.5:0.5b-instruct` for `extract()`,
    # `all-minilm:22m-l6-v2-fp16` for `embed()` — a separate, much smaller model, since embedding
    # and extraction are different tasks even where both happen to run on Ollama locally
    # (`06_DECISIONS.md` ADR-020's embed() addendum: Splink's own comparisons, per the ontology's
    # shipped `resolution` block, need no embeddings, so this is not for Stage 4 — `embed()` simply
    # belongs with `extract()` as Stage 1 infrastructure, available to whichever future phase
    # wants it) — and `moondream:1.8b-v2-q4_K_M` for `describe_image()` (Stage 2), materially
    # larger than the other two, which is exactly why its own conformance CI job runs on a slower
    # cadence (ADR-020's Stage 2 addendum) rather than every PR.
    command:
      - |
        set -e
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        pull_and_verify() {
          model="$$1"; expected="$$2"
          ollama pull "$$model"
          actual="$$(ollama list | awk -v m="$$model" '$$1 == m {print $$2}')"
          if [ "$$actual" != "$$expected" ]; then
            echo "FATAL: $$model resolved to manifest $$actual, expected $$expected (spec/06_DECISIONS.md ADR-020) — the tag moved upstream; update the ADR deliberately, do not proceed silently." >&2
            exit 1
          fi
        }
        pull_and_verify qwen2.5:0.5b-instruct a8b0c5157701
        pull_and_verify all-minilm:22m-l6-v2-fp16 1b226e2802db
        pull_and_verify moondream:1.8b-v2-q4_K_M c865c80afc38
        wait
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list | grep -q qwen2.5:0.5b-instruct && ollama list | grep -q all-minilm:22m-l6-v2-fp16 && ollama list | grep -q moondream:1.8b-v2-q4_K_M",
        ]
      interval: 5s
      timeout: 5s
      retries: 90  # the 397MB + 45MB + 1.8GB pull, on a cold volume, is the slow part
      # **`start_period`, round 13cd.** `retries: 90` at 5s is 450 seconds, and the cold pull
      # above is ~2.2GB: on a slow link it does not finish inside that, `--wait` reports ollama
      # unhealthy, and `make dev-up` fails for a reason that is neither a defect nor anything the
      # operator can act on. Seen twice in round 13bd. A failing check inside `start_period` does
      # not count against `retries`, so this gives the first pull room **without weakening the
      # steady-state check at all** — an ollama that is still unhealthy afterwards fails exactly
      # as before, which is why this is not a lowered gate.
      #
      # `speaches` below has the same shape (its own model pull, `retries: 60`) and has not been
      # observed failing this way; it is left alone rather than changed speculatively.
      start_period: 600s

  # LiteLLM proxy in front of `ollama` above — `spec/00_ARCHITECTURE.md`
  # §2.4: the Conduit (and `adapters/model_litellm`'s conformance suite)
  # talk to this one OpenAI-compatible base URL, never to Ollama directly,
  # so swapping the backend model/engine is a config change to
  # `litellm_config.yaml`, not a code change.
  litellm:
    image: ghcr.io/berriai/litellm@sha256:d295634e09c648dcdb72c4cc2dd226f5fb87823a73e88cbbed6f205e4deb044b
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: sk-ospreyflow-dev
    depends_on:
      ollama:
        condition: service_healthy
      speaches:
        condition: service_healthy
    healthcheck:
      # Not `curl` — found live, not assumed: `ghcr.io/berriai/litellm`'s image has no `curl`
      # (or `wget`) on `PATH` at all, only the Python venv it ships its own server with, so every
      # other healthcheck in this file's `CMD`-array style fails here with "executable file not
      # found" regardless of whether the server itself is healthy.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # `transcribe()`'s backend (Phase 6 Stage 2) — faster-whisper itself is a Python library, not a
  # server; `speaches` (https://github.com/speaches-ai/speaches, MIT) is the OpenAI-Whisper-API-
  # compatible server that wraps it, matching `ports/model.py`'s own "one OpenAI-compatible base
  # URL... behind a LiteLLM proxy" invariant — confirmed directly, not assumed, that LiteLLM
  # correctly proxies a multipart `/audio/transcriptions` upload to this server the same way it
  # proxies chat/embeddings JSON to Ollama.
  #
  # Pinned differently from the Ollama-backed models above: this server downloads models from
  # Hugging Face by repo id, not by Ollama manifest, and its own download endpoint takes no
  # revision/commit parameter to pin against (checked directly against its OpenAPI schema). The
  # pin is instead the model's Hugging Face commit sha, verified the same pull-then-verify way —
  # a downloaded snapshot lands at a directory named exactly for its commit sha (confirmed by
  # inspecting the container's own Hugging Face cache layout), so a tag moving upstream is
  # detected the same way an Ollama manifest digest mismatch is, just against a different cache
  # convention.
  speaches:
    image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    ports:
      - "8001:8000"
    volumes:
      - speaches-models:/home/ubuntu/.cache/huggingface/hub
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        uvicorn --factory speaches.main:create_app &
        until curl -sf http://localhost:8000/health >/dev/null 2>&1; do sleep 1; done
        curl -sf -X POST "http://localhost:8000/v1/models/Systran/faster-whisper-tiny.en" >/dev/null
        expected="0d3d19a32d3338f10357c0889762bd8d64bbdeba"
        if [ ! -d "/home/ubuntu/.cache/huggingface/hub/models--Systran--faster-whisper-tiny.en/snapshots/$$expected" ]; then
          echo "FATAL: Systran/faster-whisper-tiny.en did not resolve to commit $$expected (spec/06_DECISIONS.md ADR-020) — the model moved upstream; update the ADR deliberately, do not proceed silently." >&2
          exit 1
        fi
        wait
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models | grep -q faster-whisper-tiny"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  ollama-models:
  speaches-models:
