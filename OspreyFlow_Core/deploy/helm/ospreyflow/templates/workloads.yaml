{{- range .Values.workloads }}
{{- $ctx := dict "w" . "name" .name "root" $ }}
---
apiVersion: apps/v1
kind: {{ .kind }}
metadata:
  name: {{ .name }}
  labels:
    {{- include "ospreyflow.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .replicas }}
  {{- if eq .kind "StatefulSet" }}
  serviceName: {{ printf "%s-headless" .name }}
  # The Raft stores need their peers up together to elect a leader; one at a time would wait for
  # a readiness that needs the next one.
  podManagementPolicy: Parallel
  {{- end }}
  selector:
    matchLabels:
      {{- include "ospreyflow.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ospreyflow.labels" $ctx | nindent 8 }}
        {{- if .egress }}
        ospreyflow.io/egress: "true"
        {{- end }}
        {{- if .public }}
        ospreyflow.io/public: "true"
        {{- end }}
        {{- if .sharedAffinity }}
        ospreyflow.io/shared: "true"
        {{- end }}
      annotations:
        # A changed configuration restarts what reads it. Quoted: sixteen hex digits can be all
        # digits, or digits round one `e`, which YAML reads as a number, and an annotation is text.
        checksum/files: {{ toJson $.Values.files | sha256sum | trunc 16 | quote }}
        checksum/environment: {{ toJson $.Values.environment | sha256sum | trunc 16 | quote }}
    spec:
      {{- include "ospreyflow.podSpec" $ctx | nindent 6 }}
  {{- if .claims }}
  volumeClaimTemplates:
    {{- range .claims }}
    - metadata:
        name: {{ .name }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $.Values.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .size }}
    {{- end }}
  {{- end }}
{{- with .disruptionBudget }}
---
# ADR-148 decision 5: one copy down at a time, whatever drains the node.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $ctx.name }}
  labels:
    {{- include "ospreyflow.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: {{ .maxUnavailable }}
  selector:
    matchLabels:
      {{- include "ospreyflow.selector" $ctx | nindent 6 }}
{{- end }}
{{- end }}
