{{- if or .Values.workloads .Values.jobs }}
---
# One shared volume (05 §3b): ingest, tiles, the recipes repository, the model weights, the
# proxy's certificates. Every Conduit replica reads the same files, as Lite reads a host folder.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ospreyflow-shared
  labels:
    {{- include "ospreyflow.labels" (dict "name" "shared" "root" $) | nindent 4 }}
  annotations:
    # Kept when the release is removed: it holds the evidence and the recipes.
    helm.sh/resource-policy: keep
spec:
  {{- /* ADR-148: a platform with no ReadWriteMany class holds it on one node's ReadWriteOnce claim. */}}
  accessModes: [{{ .Values.storage.sharedAccessMode | default "ReadWriteMany" | quote }}]
  {{- with .Values.storage.sharedClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.sharedSize }}
{{- range .Values.storage.claims }}
---
# ADR-148 Amendment 5: a shared folder on a claim of its own (the poc shape's Ingest root), on the
# same class and mode as the shared claim, and kept with it when the release is removed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "ospreyflow-%s" .name }}
  labels:
    {{- include "ospreyflow.labels" (dict "name" .name "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ $.Values.storage.sharedAccessMode | default "ReadWriteMany" | quote }}]
  {{- with $.Values.storage.sharedClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}
