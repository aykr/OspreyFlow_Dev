{{- if or .Values.workloads .Values.jobs }}
---
# ADR-114 Amendment 7 on Kubernetes: a pod reaches the deployment's own pods and the cluster's DNS,
# and nothing else; anything from outside reaches nothing but the proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ospreyflow-internal
  labels:
    {{- include "ospreyflow.labels" (dict "name" "internal" "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ospreyflow
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ospreyflow
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ospreyflow
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- if dig "openEgress" true (.Values.networkPolicy | default dict) }}
---
# What a configured feature needs a route out for — the cloud's managed stores, a model provider,
# mail, the model downloads, certificates — as on Lite's `egress` network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ospreyflow-egress
  labels:
    {{- include "ospreyflow.labels" (dict "name" "egress" "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      ospreyflow.io/egress: "true"
  policyTypes: ["Egress"]
  egress:
    - {}
{{- end }}
---
# The one door: the proxy, from anywhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ospreyflow-public
  labels:
    {{- include "ospreyflow.labels" (dict "name" "public" "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      ospreyflow.io/public: "true"
  policyTypes: ["Ingress"]
  ingress:
    - {}
{{- end }}
{{- with .Values.egress }}
---
# ADR-148 decision 7: what may leave the namespace, evaluated before the deny below: the cluster's
# DNS, the namespace's own pods, the platform's managed stores, and each host an enabled feature
# reaches (Admin's settings, ADR-135 Amendment 2 and ADR-147), by its networks.
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  # Named with its tier, as Calico (3.28 and later, with tiers) stores it, so an upgrade can patch it.
  name: default.ospreyflow-allow-egress
  labels:
    {{- include "ospreyflow.labels" (dict "name" "allow-egress" "root" $) | nindent 4 }}
spec:
  tier: default
  order: 100
  selector: all()
  types: ["Egress"]
  egress:
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: {{ printf "kubernetes.io/metadata.name == '%s'" .dnsNamespace | quote }}
        ports: [53]
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: {{ printf "kubernetes.io/metadata.name == '%s'" .dnsNamespace | quote }}
        ports: [53]
    - action: Allow
      destination:
        selector: all()
    - action: Allow
      destination:
        nets: {{ toJson .managedNets }}
    {{- range .hosts }}
    # {{ .host }}
    - action: Allow
      destination:
        nets: {{ toJson .nets }}
    {{- end }}
---
# ADR-148 decision 7: egress is denied by default; nothing above, nothing out.
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  # Named with its tier, as Calico (3.28 and later, with tiers) stores it, so an upgrade can patch it.
  name: default.ospreyflow-deny-egress
  labels:
    {{- include "ospreyflow.labels" (dict "name" "deny-egress" "root" $) | nindent 4 }}
spec:
  tier: default
  order: 200
  selector: all()
  types: ["Egress"]
  egress:
    - action: Deny
{{- end }}
