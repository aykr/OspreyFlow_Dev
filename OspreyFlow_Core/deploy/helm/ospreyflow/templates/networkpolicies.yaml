{{- if or .Values.workloads .Values.jobs }}
{{- $perWorkload := dig "workloads" list (.Values.egress | default dict) }}
---
# ADR-114 Amendment 7 on Kubernetes: a pod reaches the deployment's own pods and the cluster's DNS,
# and nothing else; anything from outside reaches nothing but the proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ospreyflow-internal
  labels:
    {{- include "ospreyflow.labels" (dict "name" "internal" "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ospreyflow
  {{- /* ADR-148 Amendment 5 point 23: on a shared platform each workload's ingress is its own (below). */}}
  {{- if $perWorkload }}
  policyTypes: ["Egress"]
  {{- else }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ospreyflow
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ospreyflow
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- if dig "openEgress" true (.Values.networkPolicy | default dict) }}
---
# What a configured feature needs a route out for — the cloud's managed stores, a model provider,
# mail, the model downloads, certificates — as on Lite's `egress` network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ospreyflow-egress
  labels:
    {{- include "ospreyflow.labels" (dict "name" "egress" "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      ospreyflow.io/egress: "true"
  policyTypes: ["Egress"]
  egress:
    - {}
{{- end }}
{{- if not (dig "enabled" false (.Values.ingress | default dict)) }}
---
# The one door: the proxy, from anywhere. Not on a shared platform (ADR-148 decision 2), where the
# platform's ingress controller is the door and `ospreyflow-from-ingress` admits it alone: a policy
# admitting every address, there, would open any pod later labelled public to other tenants.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ospreyflow-public
  labels:
    {{- include "ospreyflow.labels" (dict "name" "public" "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      ospreyflow.io/public: "true"
  policyTypes: ["Ingress"]
  ingress:
    - {}
{{- end }}
{{- end }}
{{- with .Values.egress }}
---
# ADR-148 decision 7 and Amendment 5 point 21: DNS, every pod's, evaluated before the deny below.
# The one policy that selects every pod, and it allows nothing but DNS (`make cp-policy-check`).
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  # Named with its tier, as Calico (3.28 and later, with tiers) stores it, so an upgrade can patch it.
  name: default.ospreyflow-allow-dns
  labels:
    {{- include "ospreyflow.labels" (dict "name" "allow-dns" "root" $) | nindent 4 }}
spec:
  tier: default
  order: 100
  selector: all()
  types: ["Egress"]
  egress:
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: {{ printf "kubernetes.io/metadata.name == '%s'" .dnsNamespace | quote }}
        ports: [53]
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: {{ printf "kubernetes.io/metadata.name == '%s'" .dnsNamespace | quote }}
        ports: [53]
{{- $nets := dict }}
{{- range .hosts }}{{ $_ := set $nets .host .nets }}{{ end }}
{{- $managed := .managedNets }}
{{- range .workloads }}
{{- if or .toPods .managed .hosts }}
---
# What {{ .name }} alone may reach (Amendment 5 point 21): the namespace's workloads it calls, and
# the networks of the hosts it is given; nothing else, by the deny below.
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: {{ printf "default.ospreyflow-egress-%s" .name }}
  labels:
    {{- include "ospreyflow.labels" (dict "name" (printf "egress-%s" .name) "root" $) | nindent 4 }}
spec:
  tier: default
  order: 100
  selector: {{ printf "app.kubernetes.io/name == '%s'" .name | quote }}
  types: ["Egress"]
  egress:
    {{- range .toPods }}
    - action: Allow
      protocol: TCP
      destination:
        selector: {{ printf "app.kubernetes.io/name == '%s'" .name | quote }}
        ports: {{ toJson .ports }}
    {{- end }}
    {{- if .managed }}
    - action: Allow
      destination:
        nets: {{ toJson $managed }}
    {{- end }}
    {{- range .hosts }}
    # {{ . }}
    - action: Allow
      destination:
        nets: {{ toJson (get $nets .) }}
    {{- end }}
{{- end }}
{{- end }}
{{- range .workloads }}
---
# Who in the namespace may reach {{ .name }} (Amendment 5 point 23): the workloads whose paths name
# it, on its own ports, rendered from the same rows as their egress; none, if nothing calls it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "ospreyflow-ingress-%s" .name }}
  labels:
    {{- include "ospreyflow.labels" (dict "name" (printf "ingress-%s" .name) "root" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  policyTypes: ["Ingress"]
  {{- if and .fromPods .ports }}
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ toJson .fromPods }}
      ports:
        {{- range .ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
---
# ADR-148 decision 7: egress is denied by default; nothing above, nothing out.
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  # Named with its tier, as Calico (3.28 and later, with tiers) stores it, so an upgrade can patch it.
  name: default.ospreyflow-deny-egress
  labels:
    {{- include "ospreyflow.labels" (dict "name" "deny-egress" "root" $) | nindent 4 }}
spec:
  tier: default
  order: 200
  selector: all()
  types: ["Egress"]
  egress:
    - action: Deny
{{- end }}
