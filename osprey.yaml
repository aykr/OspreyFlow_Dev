# OspreyFlow deployment configuration — `docs/00_ARCHITECTURE.md` §1.2.
#
# This is the demo/CI configuration: tier 1 only, enforced by
# `docs/07_BUILD_PLAN.md`'s standing rule 3 ("the demo and CI run on tier 1
# providers only") and proved by
# `tests/test_demo_osprey_config_is_tier_1_only.py`'s rejection of any
# non-`open` provider here. Full licence-enforcement breadth (`osprey
# bundle` refusing non-redistributable data by name, tier 2-4 provider
# paths) is Checkpoint 3 scope (`07_BUILD_PLAN.md` Phase 5) — this is only
# the guard for the one file that exists today. A real deployment's own
# `osprey.yaml` is generated by the harness (Phase 8) from choices made on
# its Geospatial screen; this file is committed so the platform is
# demonstrable with zero configuration and no procurement conversation.
map:
  default: osm-local
  providers:
    - id: osm-local
      label: "OpenStreetMap"
      kind: vector
      # Built by `scripts/build_local_basemap.py` (extract -> planetiler ->
      # PMTiles) — `docs/07_BUILD_PLAN.md` Phase 5, "one-button local
      # basemap build". That script is real and tested end to end for the
      # gazetteer-load and provider-registration stages
      # (`tests/test_build_local_basemap.py`); the download and planetiler
      # stages are real code but need a live network and a real
      # `planetiler.jar` neither this repo nor CI can depend on, so this
      # exact file has not actually been produced by a live run yet —
      # tracked as an open item, not a silent gap.
      source: file:///data/tiles/osm-local.pmtiles
      style: bundled:osprey-dark
      attribution: "© OpenStreetMap contributors"
      licence:
        id: ODbL
        redistributable: true
        client_scope: open
