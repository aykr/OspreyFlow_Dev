profile: local-lite
components:
  graph_store: arcadedb
  analytics_engine: duckdb
  search: opensearch
  storage:
    data: /var/lib/osprey/data
    staging: /var/lib/osprey/staging
    backups: /var/lib/osprey/backups
    ingest: /var/lib/osprey/ingest
models:
  local_only: true
  sendable_handling_codes: []
governance:
  identity_provider: keycloak
  handling_scheme: uk-law-enforcement
  ontology: default
  real_data_exceptions: config/real_data_exceptions.yaml
cluster:
  hosts: []
network:
  expose_conduit: false
  public_origin: http://localhost:8080
map:
  default: osm-local
  providers:
  - id: osm-local
    label: OpenStreetMap
    kind: vector
    licence:
      id: ODbL
      redistributable: true
      client_scope: open
    source: file:///data/tiles/osm-local.pmtiles
    variables: {}
    proxy: none
    style: bundled:osprey-dark
    attribution: "\xA9 OpenStreetMap contributors"
