# The default ontology — docs/01_DOMAIN_MODEL.md §1.
#
# `SAME_AS` and `NOT_SAME_AS` are not listed here: the loader always injects
# both as system edge types (ADR-006), regardless of what a deployment's
# ontology says, so they are never hand-authored or removable.
#
# v4 (Phase 2): COMMUNICATED_WITH gained `duration_s`/`direction` — a
# content change, not a fixture fix, so it bumps the version like any other
# ontology change would. A recipe still declaring `ontology_version: 3` is
# blocked by `services/ingest/engine.py`'s `run_recipe` until it is opened
# and re-published against v4 (`09_INGEST_STUDIO.md`).
#
# v5 (Phase 2, corrected in v6): Location briefly gained `lon`/`lat`/
# `source_crs`/`source_x`/`source_y` directly — a real defect, since
# 03_CONDUIT_MIDDLEWARE.md §5.1 states geometry lives in the analytics
# store with the graph node holding only a reference. v6 replaces all
# five with a single optional `geometry_ref`.
#
# v6 (Phase 2): Location gained `geometry_ref` (optional — a jurisdiction
# or an administrative boundary has no single point and must be able to
# carry none at all) pointing at a row in the analytics store's geometry
# reference partition (`01_DOMAIN_MODEL.md` §7.1, `schemas/analytics.py`'s
# `GeometryRecord`). Never `lon`/`lat`/`source_x`/`source_y` on the node
# itself — see the v5 note above for why that was wrong.
#
# v7 (Phase 5): Location gained `name` (optional — a bare grid cell has
# none). A gazetteer connector (`services/ingest/connectors/geo/`)
# produces named places — "Cranford", a city, a POI — and
# `02_GLASS_FRONTEND.md` §3.5's gazetteer search resolves free-text place
# mentions against exactly this property. `place_kind` (an OSM `place=*`/
# POI-tag value) is deliberately not a property here: the recipe engine's
# `_resolve_binding` treats an empty bound field as a rejected row, not an
# omitted property (`services/ingest/engine.py`), so a genuinely optional
# per-node classification has no way to bind cleanly yet — recorded as an
# open item rather than worked around with a fabricated default value.
# Every recipe fixture pinned to `ontology_version: 6` is bumped to 7
# alongside this change — none of them bind `name`, so nothing about their
# own behaviour changes; they are just re-published against the current
# ontology, the same re-publish `09_INGEST_STUDIO.md` describes for any
# ontology edit.
#
# v8 (Phase 5, the HMP fixture's graph side): three additions, none of
# them external-gazetteer identifiers, because none of this is external
# data. `Location` gained `site_ref` — a deployment-internal reference
# (a yard, a wing, a cell, eventually a site-grid cell) distinct from
# `uprn`/`osm_id`/etc., which all name a place in an *external* gazetteer.
# `Organisation` gained `org_ref` (the same idea, for an internal group
# with no Companies House number or EIN) and `name` (it had no display
# property at all until now — the same gap `name` closed for `Location`
# in v7). `Document` gained `title`, for the same reason. Every recipe
# fixture pinned to `ontology_version: 7` is bumped to 8 alongside this.
#
# v9 (Phase 5 Checkpoint 3c): four new *external*-gazetteer identifiers on
# `Location` — the same category `uprn`/`gnis_feature_id`/`tiger_geoid`/
# `osm_id` already are, not the internal `*_ref` category v8 added.
# `os_place_id` (OS Open Names), `postcode` (Code-Point Open — a
# postcode-centroid gazetteer entry, distinct from the `postcode` Knowledge
# Adapter's own normalised-string output on other entity types),
# `gss_code` (Boundary-Line's ONS administrative-area code — this is the
# one identifier here whose `Location` typically has no `geometry_ref` at
# all, per that property's own existing "a jurisdiction... must be able to
# carry none" allowance), and `nad_address_id` (US National Address
# Database). Every recipe fixture pinned to `ontology_version: 8` is
# bumped to 9 alongside this.
version: 9
entity_types:
  - name: Person
    pole_class: person
    channel: indigo
    shape: circle
    identifiers: [nino, pnc_id, prison_number, passport_number]
    properties:
      - {name: family_name, type: string, indexed: true, required: true}
      - {name: given_names, type: string, indexed: true}
      - {name: date_of_birth, type: date, indexed: true, sensitivity: high}
      - {name: aliases, type: "string[]", indexed: true}
    resolution:
      blocking: [soundex(family_name), year(date_of_birth)]
      comparisons: [jaro_winkler(family_name), levenshtein(given_names), exact(date_of_birth)]

  - name: Endpoint
    pole_class: object
    channel: cyan
    shape: hexagon
    identifiers: [e164, handle, email, imsi]
    properties:
      - {name: value_raw, type: string}
      - {name: value_normalised, type: string, indexed: true, required: true}
      - {name: endpoint_kind, type: enum, values: [msisdn, imsi, email, handle, iban, card]}

  - name: Device
    pole_class: object
    channel: plum
    shape: square
    identifiers: [imei]

  - name: Location
    pole_class: location
    channel: ochre
    shape: pin
    identifiers: [uprn, gnis_feature_id, tiger_geoid, osm_id, site_ref, os_place_id, postcode, gss_code, nad_address_id]
    properties:
      # 03_CONDUIT_MIDDLEWARE.md §5.1: geometry lives in the analytics
      # store, never on the graph node — this is a reference, not a
      # coordinate. Not required: a jurisdiction or an administrative
      # boundary has no single point and must be able to carry none.
      - {name: geometry_ref, type: string}
      # v7: a gazetteer place name — optional, since a site-grid cell or
      # an administrative boundary has none.
      - {name: name, type: string, indexed: true}

  - name: Organisation
    pole_class: organisation
    channel: azure
    shape: square
    identifiers: [companies_house_number, ein, org_ref]
    properties:
      # v8: no display property existed at all before this — the same
      # gap `name` closed for `Location` in v7.
      - {name: name, type: string, indexed: true}

  - name: Event
    pole_class: event
    channel: moss
    shape: diamond

  - name: Document
    pole_class: object
    channel: violet
    shape: page
    properties:
      - {name: title, type: string, indexed: true}

  - name: Vehicle
    pole_class: object
    channel: jade
    shape: triangle
    identifiers: [vrm, vin]

  - name: Asset
    pole_class: object
    channel: rose
    shape: diamond

edge_types:
  - name: COMMUNICATED_WITH
    from: [Endpoint]
    to: [Endpoint]
    directed: true
    temporal: true
    properties:
      - {name: duration_s, type: float}
      - {name: direction, type: enum, values: [inbound, outbound]}
  - {name: USES,              from: [Person], to: [Endpoint, Device], directed: true}
  - {name: PRESENT_AT,        from: [Person, Device, Vehicle], to: [Location], directed: true, temporal: true}
  - {name: MENTIONED_IN,      from: ["*"], to: [Document], directed: true}
  - {name: ASSOCIATE_OF,      from: [Person], to: [Person], directed: false}
  - name: FAMILY_OF
    from: [Person]
    to: [Person]
    directed: false
    properties:
      - {name: relation, type: string}
  - {name: MEMBER_OF,         from: [Person], to: [Organisation], directed: true}
  - {name: TRANSACTED,        from: [Asset, Endpoint], to: [Asset, Endpoint], directed: true, temporal: true}
  # By convention the source is an Endpoint of kind `imsi` only — an MSISDN
  # reaches the same Device via SAME_AS to its IMSI Endpoint first, never
  # directly (06_DECISIONS.md ADR-023). `from`/`to` check entity type, not
  # `endpoint_kind`, so this is not schema-enforced.
  - {name: PAIRED_WITH,       from: [Endpoint], to: [Device], directed: true, temporal: true}
