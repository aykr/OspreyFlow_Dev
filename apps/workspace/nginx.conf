# The Glass is a single-page application: every unknown path is one of its
# own routes, so `try_files` falls back to index.html rather than 404ing.
# Without this, refreshing on a deep link into an investigation breaks.
#
# Port 8080, not 80: docs/05_DEPLOYMENT.md §7 requires containers to run
# as non-root, and a non-root process cannot bind a privileged port.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable; index.html must never be
    # cached, or a deployed upgrade keeps serving the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
