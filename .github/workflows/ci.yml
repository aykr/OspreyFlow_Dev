name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: OspreyFlow_Core

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync
      - run: npm ci
      - run: uv run ruff check .
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync
      - run: npm ci
      # `harness` joined `Makefile`'s own `typecheck` target on 24 September 2026 (ADR-049 Stage 2
      # §3/§4) but never joined this job's — the identical class of Makefile/ci.yml drift
      # `test-file-coverage-check` was widened to catch for `--ignore` lists (26 September 2026),
      # found here by inspection while wiring `harness/webapp.py` into CI for the same reason.
      - run: uv run mypy packages services harness
      - run: npm run typecheck

  licence-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync
      - run: npm ci
      - run: PYTHONPATH=OspreyFlow_Build uv run python -m tools.licence_check
      - run: npm run licence-check
      # Deterministic proof that a GPL dependency fails the build
      # (Phase 0 exit criterion, process/07_BUILD_PLAN.md) — see
      # OspreyFlow_Build/tests/licence_check/test_gpl_rejection.py.
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/licence_check
      # Same proof for the Node half's own isAllowed predicate — had no test at all until
      # 06_DECISIONS.md ADR-034 §B10's own gate audit found it.
      - run: node --test ../OspreyFlow_Build/tests/licence_check/*.test.mjs

  # `spec/06_DECISIONS.md` ADR-041 (accepted, option (b)): mechanical control for the
  # fetch-then-check authorization bug class found three times over (review.py, the fakes that
  # never exercised the query, pattern_store.py — and, checked directly while scoping the ADR,
  # three more live instances: sites.py, investigations.py, studio_recipes.py, all fixed the same
  # session this job was added). See OspreyFlow_Build/tools/authorized_query_check.py's own docstring for what it
  # checks and its own disclosed limits.
  authorized-query-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: PYTHONPATH=OspreyFlow_Build uv run python -m tools.authorized_query_check
      # Deterministic proof it actually fails on the bug class it exists to catch — see
      # OspreyFlow_Build/tests/authorized_query_check/test_principal_predicate_required.py.
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/authorized_query_check

  # `07_BUILD_PLAN.md`'s Phase 8 documentation-refresh entry: a small, real stand-in for
  # ADR-035's own still-unbuilt fail-closed demo registry, so a demo added with no matching
  # DEMO_GUIDE.md update fails here rather than being found at publication. See
  # OspreyFlow_Build/tools/demo_guide_check.py's own docstring.
  demo-guide-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: PYTHONPATH=OspreyFlow_Build uv run python -m tools.demo_guide_check
      # Deterministic proof it is not vacuous — see
      # OspreyFlow_Build/tests/test_demo_guide_registry_check.py's own two negative cases.
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/test_demo_guide_registry_check.py

  # `07_BUILD_PLAN.md`'s Phase 8 documentation-refresh entry, same shape as demo-guide-check
  # above: an allowlist of current debt (OspreyFlow_Build/tests/fixtures/domain_model_coverage_allowlist.txt) so
  # new drift fails immediately while existing debt stays enumerated and countable. See
  # OspreyFlow_Build/tools/domain_model_coverage_check.py's own docstring.
  domain-model-coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: PYTHONPATH=OspreyFlow_Build uv run python -m tools.domain_model_coverage_check
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/test_domain_model_coverage_check.py

  # Same shape, for `spec/03_CONDUIT_MIDDLEWARE.md`'s own route table — allowlist at
  # OspreyFlow_Build/tests/fixtures/route_coverage_allowlist.txt. See OspreyFlow_Build/tools/route_coverage_check.py's own
  # docstring, including why paths are normalised before comparing.
  route-coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: PYTHONPATH=OspreyFlow_Build uv run python -m tools.route_coverage_check
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/test_route_coverage_check.py

  # Same shape, for the product-tree link-integrity gate — `06_DECISIONS.md` ADR-034 §B8.
  # Allowlist at OspreyFlow_Build/tests/fixtures/product_tree_link_allowlist.txt. See
  # OspreyFlow_Build/tools/product_tree_link_check.py's own docstring, including why it is scoped to
  # documentation-to-documentation references only and how it differs from the still-open
  # doc_citations_check.py question.
  product-tree-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: PYTHONPATH=OspreyFlow_Build uv run python -m tools.product_tree_link_check
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/test_product_tree_link_check.py

  # Same shape, one level down — does a PRODUCT-classified ADR in 06_DECISIONS.md cite a
  # PROCESS-classified one by number. `06_DECISIONS.md` ADR-034 §B10. Allowlist at
  # OspreyFlow_Build/tests/fixtures/decision_log_publication_allowlist.txt (6 known references, found on this
  # gate's own first real run). See OspreyFlow_Build/tools/decision_log_publication_check.py's own docstring.
  decision-log-publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: PYTHONPATH=OspreyFlow_Build uv run python -m tools.decision_log_publication_check
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/test_decision_log_publication_check.py

  # Same shape, for test-file CI coverage — found four test files running in no intended job
  # before this gate existed (test_pattern_store.py, test_alerts.py, test_change_stream.py,
  # test_assessment_routes.py), each by accident, and two more (test_fixture_corp_shape.py,
  # test_worker.py) on this gate's own first real run. See
  # OspreyFlow_Build/tools/test_file_coverage_check.py's own docstring.
  citation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/test_doc_citations_check.py

  test-file-coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: PYTHONPATH=OspreyFlow_Build uv run python -m tools.test_file_coverage_check
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/test_test_file_coverage_check.py

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: OspreyFlow_Core
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules,.venv

  # Standing rule (process/07_BUILD_PLAN.md): each service's Dockerfile and its
  # `trivy image` scan land in the phase that creates the service, not
  # batched into Phase 8. `services/ingest` is Phase 2's.
  # `ignore-unfixed`: unlike the fs scan above, an image scan turns up
  # base-OS packages this service never touches with no upstream fix yet —
  # failing forever on those is noise, not a gate.
  trivy-image-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/ingest/Dockerfile -t ospreyflow/ingest:ci .
      - uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ospreyflow/ingest:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # apps/workspace's Dockerfile — Phase 4's own, unpaid from Phase 4 until
  # Stage 2 §5a (spec/06_DECISIONS.md ADR-049). Recorded there as a rule 8
  # repayment, not an exception: the rule keeps its full force, and a future
  # service that skips its image is still in violation.
  trivy-image-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/workspace/Dockerfile -t ospreyflow/workspace:ci .
      - uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ospreyflow/workspace:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # harness/Dockerfile — Stage 2 §5b's own bootstrap image (spec/05_DEPLOYMENT.md §2's "one Docker
  # command"), paid here as a rule-8 repayment the same way apps/workspace's was at Stage 2 §5a.
  trivy-image-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f harness/Dockerfile -t ospreyflow/harness:ci .
      - uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ospreyflow/harness:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # services/api's Dockerfile, Phase 3's own — same reasoning as
  # trivy-image-ingest above.
  trivy-image-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t ospreyflow/api:ci .
      - uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ospreyflow/api:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  schemas-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync
      - run: npm ci
      # OspreyFlow_Build/tools/schemas_check.py shells out to node_modules/.bin/json2ts.
      - run: PYTHONPATH=OspreyFlow_Build uv run python -m tools.schemas_check

  conformance-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/conformance -k test_guard

  # GraphPort's conformance suite (Phase 1, process/07_BUILD_PLAN.md) runs
  # against a live ArcadeDB — the graph store local-lite actually ships —
  # not a fake. One container, matching local-lite's own shape.
  # OspreyFlow_Build/tests/ingest's recipe-engine end-to-end test needs the same live
  # ArcadeDB (Phase 2); test_staging.py in the same directory needs MinIO
  # too. Phase 3 adds Valkey and Postgres for the Working-Set Service, the
  # statelessness proof and the exit-criterion scenario test — the same
  # four stores `deploy/compose/dev.yaml` (`make dev-up`) brings up
  # locally, so this job and a developer's laptop run the identical test
  # set against the identical stack.
  conformance:
    runs-on: ubuntu-latest
    services:
      arcadedb:
        image: arcadedata/arcadedb:25.5.1
        ports:
          - 2480:2480
        env:
          JAVA_OPTS: "-Darcadedb.server.rootPassword=playwithdata123"
          # Same heap override as deploy/compose/dev.yaml, for stack parity
          # (see that file's comment for the full reasoning, including why
          # this value doesn't try to cover two full concurrent suite runs).
          # This job only ever runs one sequential pytest invocation against
          # this container, which a single-run measurement shows needs far
          # less than 4GB, so this is comfortable headroom, not a tight fit,
          # on a hosted runner's RAM.
          ARCADEDB_OPTS_MEMORY: "-Xms1G -Xmx4G"
        options: >-
          --health-cmd "curl -sf -u root:playwithdata123 http://localhost:2480/api/v1/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: osprey
          POSTGRES_PASSWORD: playwithdata123
          POSTGRES_DB: ospreyflow
        options: >-
          --health-cmd "pg_isready -U osprey -d ospreyflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARCADEDB_HOST: localhost
      ARCADEDB_HTTP_PORT: "2480"
      ARCADEDB_ROOT_PASSWORD: playwithdata123
      MINIO_ENDPOINT: "localhost:9000"
      VALKEY_HOST: localhost
      POSTGRES_HOST: localhost
      # This job's own postgres service (below) still publishes on 5432 —
      # only deploy/compose/dev.yaml's local-dev stack uses 5433. Explicit
      # here rather than relying on services/api/config.py's default, which
      # now points at 5433 to match that local-dev remap.
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # MinIO's image needs `server /data --console-address :9001` as its
      # command, which GitHub Actions' `services:` block cannot override
      # (no `command:` key) — run it directly instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z \
            server /data --console-address :9001
          for _ in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 3
          done
      - run: uv sync
      # `test_sites_store.py`/`test_hmp_graph.py` added here (not their own job) since this job
      # already has the one live service each needs — Postgres for the former, ArcadeDB for the
      # latter — the same reasoning every other file in this list already follows. Before this,
      # neither ran anywhere in CI (`07_BUILD_PLAN.md`'s own gaps entry on the ten `make test`
      # `--ignore`s found this) despite `test`'s own comment below claiming "every other test
      # runs here" — checked directly: this job's own `--ignore` list was a strict subset of
      # `Makefile`'s `test` target's, so neither file was actually excluded from the `test` job
      # either, meaning it would have failed there with no live store to connect to, not merely
      # gone unrun. `test_sites_store.py`'s own module docstring is the reason this one matters:
      # the one direct-Postgres proof of `SiteStore`'s access control, distinct from
      # `test_sites_routes.py`'s own fake (which only proves the fake's hardcoded check, not the
      # real query — the exact class `07_BUILD_PLAN.md`'s "Fake-based tests" gaps entry already
      # warns about). `test_hmp_graph.py` is `08_ACCEPTANCE_SCENARIOS.md` Scenario A's own graph
      # fixture.
      # `test_change_stream.py`/`test_alerts.py` (Phase 7 Stage 6a, `06_DECISIONS.md` ADR-037/
      # 038/039) land here too — the Gate this stage was built under: "new service-backed tests
      # get wired into the live-service CI job, not added to an ignore list." Both need Postgres
      # (the alert store, the audit log) and ArcadeDB (the referent recheck / the resolution
      # producer); `test_alerts.py` also needs the same access-control discipline the sites_store
      # entry above already argues for — a fake could not prove "evidence unreadable after a
      # handling change" at all.
      # `test_pattern_store.py` was found here, not carried over from anywhere: it was already in
      # the `test` job's own `--ignore` list (correctly — it needs live Postgres) but was never
      # actually added to this job's run list when it was written, so it has never run in any CI
      # job at all — the exact class of gap this job's own comment above already describes finding
      # for `test_sites_store.py`/`test_hmp_graph.py`, recurring for one more file. Fixed here
      # alongside the Stage 6b files below rather than filed separately, since `test_monitors.py`
      # now depends on `PatternStore` and would otherwise be the second store leaning on an
      # access-control proof that itself never runs.
      # `test_hotlists.py`/`test_monitors.py`/`test_evaluation.py` (Phase 7 Stage 6b,
      # `06_DECISIONS.md` ADR-036/037/038) — Postgres for the first two, plus ArcadeDB and Valkey
      # for `test_evaluation.py` (the match itself, the overlap-guard lock, the monitor dedup
      # signature).
      # Fifteen more, found and added the same session as the reconciliation above (Phase 7 Stage
      # 6b's own read-before-building pass) — every one already runs against nothing but the four
      # stores this job already stands up (ArcadeDB, Valkey, Postgres, MinIO), so joining this job
      # cost no new service and no new job, only these lines. All 15 were run as a set for the
      # first time as part of that check and all 15 passed — not assumed safe to add, confirmed.
      # Seven prove an access-control invariant (`test_access.py`, `test_dossier_access_control.py`,
      # `test_projection_access_control.py`, and the four `working_set/test_*_access_control.py`
      # files) and had been unverified in any CI job until now — the highest-consequence entries in
      # this list, per CLAUDE.md rule 4 ("every read path gets an access-control test. No
      # exceptions"). `test_match_live.py` is `services/geocoder/match.py`'s own real-adapter proof
      # (an ontology-validation gap a fake could not catch, `07_BUILD_PLAN.md`'s own precedent for
      # why this class of file matters). `test_trigger.py` is the corpus-wide resolution trigger's
      # own correctness (locking, `service_principal` scoping). `test_phase6a_glass_surfaces.py` is
      # Phase 6a's own exit-criterion scenario (B6/B9/B10/B11) end to end. `test_review.py`/
      # `test_review_store.py`/`test_studio_recipes_store.py` are Postgres-store/business-logic
      # correctness; `test_prefetch.py`/`test_tile_cache.py` are MinIO round-trip correctness.
      # `test_assessments.py` (Phase 8 Stage 4b, `06_DECISIONS.md` ADR-046) needs Postgres (the
      # judgement store) and ArcadeDB (the per-citation access recheck, the review-flag loop's own
      # `supersede_node` trigger) — the same "new service-backed tests get wired into the
      # live-service CI job, not added to an ignore list" gate `test_alerts.py`'s own comment above
      # already names, applied here on the same session it was named for.
      # `test_assessment_routes.py` (Phase 8 Stage 4c) was never added here when it landed —
      # found live, not assumed, while wiring Stage 4d's own new files: it needs the identical
      # real Postgres/ArcadeDB this job already stands up, and had been running (and would fail)
      # in the plain `test` job below instead, which stands up neither — the exact gap class
      # `test_pattern_store.py`'s own comment above already found once for a different file.
      # `test_export.py`/`test_export_routes.py` (Phase 8 Stage 4d, `06_DECISIONS.md`
      # ADR-045/046/047) — Postgres (the export ledger, the judgement store) and ArcadeDB (the
      # handling-scheme gate, the cross-session access recheck); wired in on landing, not found
      # missing later.
      # `test_fixture_corp_shape.py` (Phase 8 Stage 4a, `06_DECISIONS.md` ADR-035 §C5) and
      # `test_worker.py` (`JobWorker`'s own Valkey-Streams consumer-group mechanics) — found by
      # `OspreyFlow_Build/tools/test_file_coverage_check.py`'s own first real run, this same change: both had
      # run nowhere in CI since the day each was written, the identical gap class this gate exists
      # to catch, now caught by the gate itself rather than found by accident a fifth and sixth
      # time.
      - run: >-
          uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/conformance/graph_port ../OspreyFlow_Build/tests/ingest
          ../OspreyFlow_Build/tests/services/api/test_valkey_store.py
          ../OspreyFlow_Build/tests/services/api/test_ws_ticket.py
          ../OspreyFlow_Build/tests/services/api/test_statelessness.py
          ../OspreyFlow_Build/tests/scenarios/test_phase3_working_set.py
          ../OspreyFlow_Build/tests/services/api/test_sites_store.py
          ../OspreyFlow_Build/tests/scenarios/test_hmp_graph.py
          ../OspreyFlow_Build/tests/services/api/test_change_stream.py
          ../OspreyFlow_Build/tests/services/api/test_alerts.py
          ../OspreyFlow_Build/tests/services/api/test_pattern_store.py
          ../OspreyFlow_Build/tests/services/api/test_hotlists.py
          ../OspreyFlow_Build/tests/services/api/test_monitors.py
          ../OspreyFlow_Build/tests/services/api/test_evaluation.py
          ../OspreyFlow_Build/tests/geocoder/test_match_live.py
          ../OspreyFlow_Build/tests/resolve/test_projection_access_control.py
          ../OspreyFlow_Build/tests/resolve/test_trigger.py
          ../OspreyFlow_Build/tests/scenarios/test_phase6a_glass_surfaces.py
          ../OspreyFlow_Build/tests/services/api/test_access.py
          ../OspreyFlow_Build/tests/services/api/test_dossier_access_control.py
          ../OspreyFlow_Build/tests/services/api/test_prefetch.py
          ../OspreyFlow_Build/tests/services/api/test_review.py
          ../OspreyFlow_Build/tests/services/api/test_review_store.py
          ../OspreyFlow_Build/tests/services/api/test_studio_recipes_store.py
          ../OspreyFlow_Build/tests/services/api/test_tile_cache.py
          ../OspreyFlow_Build/tests/services/api/working_set/test_compute_access_control.py
          ../OspreyFlow_Build/tests/services/api/working_set/test_explain_cluster_access_control.py
          ../OspreyFlow_Build/tests/services/api/working_set/test_manual_resolution_access_control.py
          ../OspreyFlow_Build/tests/services/api/working_set/test_resolution_threshold_access_control.py
          ../OspreyFlow_Build/tests/scenarios/test_phase7_stage6c_watch_routes.py
          ../OspreyFlow_Build/tests/services/api/test_assessments.py
          ../OspreyFlow_Build/tests/test_case_seed.py
          ../OspreyFlow_Build/tests/services/api/test_investigation_access_store.py
          ../OspreyFlow_Build/tests/services/api/test_link_notes_store.py
          ../OspreyFlow_Build/tests/services/api/test_suppression.py
          ../OspreyFlow_Build/tests/services/api/test_assessment_routes.py
          ../OspreyFlow_Build/tests/services/api/test_export.py
          ../OspreyFlow_Build/tests/services/api/test_export_routes.py
          ../OspreyFlow_Build/tests/scenarios/test_fixture_corp_shape.py
          ../OspreyFlow_Build/tests/services/api/test_worker.py ../OspreyFlow_Build/tests/services/api/test_worker_replicas.py ../OspreyFlow_Build/tests/services/api/test_revoked_principal_precheck.py
      - run: npm ci
      # `deltaClient.integration.test.ts` (Phase 4) spawns the real
      # `services.api.app` (`apps/workspace/test/glass_test_server.py`)
      # against this same ArcadeDB/Valkey/Postgres — the one live-infra
      # dependency the Glass's own test suite has, so it runs in this job
      # rather than the plain `test` job below.
      - run: npm run test:integration --workspace apps/workspace

  # `ModelPort`'s conformance suite (Phase 6 Stage 1) — needs a live LiteLLM
  # proxy in front of Ollama, pinned per spec/06_DECISIONS.md ADR-020. A
  # separate job from `conformance` above: that job's four stores are
  # already the ones `deploy/compose/dev.yaml` brings up together, but
  # Ollama/LiteLLM need a model pull and a mounted config file neither of
  # which GitHub Actions' `services:` block supports (no `command:` override,
  # no volume mounts) — the same limitation the `conformance` job's own
  # MinIO step already works around, here for two containers instead of one.
  conformance-model:
    runs-on: ubuntu-latest
    # ArcadeDB + Valkey, added to unlock `test_phase6_extraction_and_resolution.py` — the one file
    # needing ArcadeDB, Valkey and Ollama/LiteLLM together, a combination neither this job nor
    # `conformance` individually provided (`07_BUILD_PLAN.md`'s own "Gaps with no owning phase"
    # entry). Added here, not as a new job, so the addition is marginal against this job's own
    # already-paid Ollama/LiteLLM setup cost rather than paying both setups from scratch. Deliberately
    # *not* Postgres/MinIO: the target test needs neither (`_NullExtractionCandidateStore`, no real
    # Postgres round trip). `-Xmx4G` matches `conformance`'s own ArcadeDB sizing exactly, not raised
    # for this job specifically — `deploy/compose/dev.yaml`'s own documented ArcadeDB/Ollama
    # memory-contention incident (six local OOM-kills across this build, per that file's own comment)
    # is exactly the risk of running both together, so this starts at the already-proven-sufficient
    # value rather than guessing a runner needs more.
    #
    # **Watched for contention before committing to this, not assumed safe — held.** Simulated
    # locally on a machine with a comparable memory budget to a standard hosted runner (~7.6GB):
    # a fresh ArcadeDB at this exact `-Xmx4G`, alongside the already-running Ollama/LiteLLM/speaches
    # containers, ran the target test in isolation, then twice more back to back, then the full real
    # command this job actually runs below (all 11 tests together) — four separate invocations, all
    # passed, no `OOMKilled`, ArcadeDB settling around 4.0-4.2GB (near but not over its own ceiling)
    # rather than growing unbounded, total footprint leaving real headroom under the budget. Kept on
    # that evidence. If this destabilises on the actual runner despite the local read, revert this
    # block and the run-list line below, restore `--ignore=OspreyFlow_Build/tests/scenarios/test_phase6_extraction_
    # and_resolution.py` to the `test` job, and record the failure mode in `07_BUILD_PLAN.md` rather
    # than silently reverting — the next person to consider this extension should not repeat the
    # simulation blind.
    services:
      arcadedb:
        image: arcadedata/arcadedb:25.5.1
        ports:
          - 2480:2480
        env:
          JAVA_OPTS: "-Darcadedb.server.rootPassword=playwithdata123"
          ARCADEDB_OPTS_MEMORY: "-Xms1G -Xmx4G"
        options: >-
          --health-cmd "curl -sf -u root:playwithdata123 http://localhost:2480/api/v1/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARCADEDB_HOST: localhost
      ARCADEDB_HTTP_PORT: "2480"
      ARCADEDB_ROOT_PASSWORD: playwithdata123
      VALKEY_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Start Ollama and pull the ADR-020-pinned models
        run: |
          docker network create model-port-ci
          docker run -d --name ollama --network model-port-ci -p 11434:11434 \
            ollama/ollama@sha256:5a5d014aa774f78ebe1340c0d4afc2e35afc12a2c3b34c84e71f78ea20af4ba3
          for _ in $(seq 1 30); do
            docker exec ollama ollama list >/dev/null 2>&1 && break
            sleep 2
          done
          # ADR-020: Ollama has no working digest-pull for a library model
          # (tested directly against 0.18.2 — `ollama pull <name>@sha256:...`
          # returns "400 Bad Request: invalid model name") — the pin is
          # enforced by checking each pulled tag's own resulting manifest
          # digest instead, failing the job if a tag has moved upstream
          # rather than silently running a different model. Two models:
          # `qwen2.5:0.5b-instruct` for extract(), `all-minilm:22m-l6-v2-fp16`
          # for embed() — the same pair `deploy/compose/dev.yaml` pulls. The
          # vision model (`moondream`) is deliberately not pulled here — see
          # `conformance-model-vision` below.
          pull_and_verify() {
            model="$1"; expected="$2"
            docker exec ollama ollama pull "$model"
            actual="$(docker exec ollama ollama list | awk -v m="$model" '$1 == m {print $2}')"
            if [ "$actual" != "$expected" ]; then
              echo "$model resolved to manifest $actual, expected $expected" >&2
              echo "(spec/06_DECISIONS.md ADR-020) — the tag moved upstream; do not proceed silently." >&2
              exit 1
            fi
          }
          pull_and_verify qwen2.5:0.5b-instruct a8b0c5157701
          pull_and_verify all-minilm:22m-l6-v2-fp16 1b226e2802db
      - name: Start speaches and pull the ADR-020-pinned Whisper model
        run: |
          docker run -d --name speaches --network model-port-ci -p 8001:8000 \
            ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8001/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf -X POST "http://localhost:8001/v1/models/Systran/faster-whisper-tiny.en" >/dev/null
          # Same reasoning as the Ollama models above, different mechanism: this server has no
          # revision-pinning parameter on its own download endpoint (checked directly against its
          # OpenAPI schema), so the pin is a Hugging Face commit sha, verified against the
          # downloaded snapshot's own cache directory name.
          expected="0d3d19a32d3338f10357c0889762bd8d64bbdeba"
          if ! docker exec speaches test -d "/home/ubuntu/.cache/huggingface/hub/models--Systran--faster-whisper-tiny.en/snapshots/$expected"; then
            echo "Systran/faster-whisper-tiny.en did not resolve to commit $expected" >&2
            echo "(spec/06_DECISIONS.md ADR-020) — the model moved upstream; do not proceed silently." >&2
            exit 1
          fi
      - name: Start LiteLLM
        run: |
          docker run -d --name litellm --network model-port-ci -p 4000:4000 \
            -v "${{ github.workspace }}/deploy/compose/litellm_config.yaml:/app/config.yaml:ro" \
            -e LITELLM_MASTER_KEY=sk-ospreyflow-dev \
            ghcr.io/berriai/litellm@sha256:d295634e09c648dcdb72c4cc2dd226f5fb87823a73e88cbbed6f205e4deb044b \
            --config /app/config.yaml --port 4000
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4000/health/liveliness && break
            sleep 2
          done
      # `moondream` (describe_image()'s model) is not pulled in this job, so LiteLLM logs a
      # warning for that one unreachable model entry — harmless; test_suite_vision.py is excluded
      # below and no other test in this job calls it.
      - run: >-
          uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/conformance/model_port
          --ignore=../OspreyFlow_Build/tests/conformance/model_port/test_suite_vision.py
          ../OspreyFlow_Build/tests/scenarios/test_witness_statement_extraction.py
          ../OspreyFlow_Build/tests/golden
          ../OspreyFlow_Build/tests/scenarios/test_phase6_extraction_and_resolution.py

  # `describe_image()`'s own conformance case (`spec/06_DECISIONS.md` ADR-020's Stage 2 addendum)
  # — merge-to-main only, not every PR: a vision-language model is materially heavier (1.8GB) than
  # any of the three models `conformance-model` above pulls, the same `02_GLASS_FRONTEND.md` §5
  # precedent that keeps the full performance-budget run off every commit. Otherwise an exact
  # mirror of `conformance-model`'s own Ollama/LiteLLM setup, with `moondream` pulled instead of
  # skipped and only the vision test file run.
  conformance-model-vision:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Start Ollama and pull the ADR-020-pinned vision model
        run: |
          docker network create model-port-ci
          docker run -d --name ollama --network model-port-ci -p 11434:11434 \
            ollama/ollama@sha256:5a5d014aa774f78ebe1340c0d4afc2e35afc12a2c3b34c84e71f78ea20af4ba3
          for _ in $(seq 1 30); do
            docker exec ollama ollama list >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec ollama ollama pull moondream:1.8b-v2-q4_K_M
          actual="$(docker exec ollama ollama list | awk '$1 == "moondream:1.8b-v2-q4_K_M" {print $2}')"
          expected="c865c80afc38"
          if [ "$actual" != "$expected" ]; then
            echo "moondream:1.8b-v2-q4_K_M resolved to manifest $actual, expected $expected" >&2
            echo "(spec/06_DECISIONS.md ADR-020) — the tag moved upstream; do not proceed silently." >&2
            exit 1
          fi
      - name: Start LiteLLM
        run: |
          docker run -d --name litellm --network model-port-ci -p 4000:4000 \
            -v "${{ github.workspace }}/deploy/compose/litellm_config.yaml:/app/config.yaml:ro" \
            -e LITELLM_MASTER_KEY=sk-ospreyflow-dev \
            ghcr.io/berriai/litellm@sha256:d295634e09c648dcdb72c4cc2dd226f5fb87823a73e88cbbed6f205e4deb044b \
            --config /app/config.yaml --port 4000
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4000/health/liveliness && break
            sleep 2
          done
      - run: uv run pytest -c ../OspreyFlow_Build/pytest.ini ../OspreyFlow_Build/tests/conformance/model_port/test_suite_vision.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync
      - run: npm ci
      # Everything the `conformance`/`conformance-model` jobs above already cover against a live
      # store or a live model runs here instead against nothing — every other test runs here.
      # **What is actually still excluded, current as of the reconciliation below, not the
      # original incident report (`07_BUILD_PLAN.md`'s own gaps entry has that history in full):**
      # fifteen of the seventeen files that entry found were added to `conformance`'s own run list
      # above the same session this comment was rewritten — every one needed only the four stores
      # that job already stands up (ArcadeDB, Valkey, Postgres, MinIO), so "real work, owned in
      # `07_BUILD_PLAN.md`" overstated the actual cost of fixing most of them; that framing is
      # exactly what left this open as long as it did. `test_golden_set.py`/
      # `test_witness_statement_extraction.py` were already correctly wired into
      # `conformance-model` (Ollama/LiteLLM), not orphaned — an earlier pass mis-filed them as
      # unwired without checking that job's own run list, corrected here.
      #
      # **What is genuinely still excluded, and why:** `test_phase6_extraction_and_resolution.py`
      # alone — the one file needing ArcadeDB *and* Ollama/LiteLLM *and* Valkey together, a
      # combination neither this job nor `conformance`/`conformance-model` individually provides.
      # See `conformance-model`'s own comment above for the outcome of extending that job to cover
      # it (attempted the same session).
      - run: >-
          uv run pytest -c ../OspreyFlow_Build/pytest.ini --ignore=../OspreyFlow_Build/tests/conformance/graph_port
          --ignore=../OspreyFlow_Build/tests/conformance/model_port --ignore=../OspreyFlow_Build/tests/golden --ignore=../OspreyFlow_Build/tests/ingest
          --ignore=../OspreyFlow_Build/tests/services/api/test_valkey_store.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_ws_ticket.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_statelessness.py
          --ignore=../OspreyFlow_Build/tests/scenarios/test_phase3_working_set.py
          --ignore=../OspreyFlow_Build/tests/scenarios/test_witness_statement_extraction.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_sites_store.py
          --ignore=../OspreyFlow_Build/tests/scenarios/test_hmp_graph.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_change_stream.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_alerts.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_hotlists.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_monitors.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_evaluation.py
          --ignore=../OspreyFlow_Build/tests/scenarios/test_phase6_extraction_and_resolution.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_pattern_store.py
          --ignore=../OspreyFlow_Build/tests/geocoder/test_match_live.py
          --ignore=../OspreyFlow_Build/tests/resolve/test_projection_access_control.py
          --ignore=../OspreyFlow_Build/tests/resolve/test_trigger.py
          --ignore=../OspreyFlow_Build/tests/scenarios/test_phase6a_glass_surfaces.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_access.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_dossier_access_control.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_prefetch.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_review.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_review_store.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_studio_recipes_store.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_tile_cache.py
          --ignore=../OspreyFlow_Build/tests/services/api/working_set/test_compute_access_control.py
          --ignore=../OspreyFlow_Build/tests/services/api/working_set/test_explain_cluster_access_control.py
          --ignore=../OspreyFlow_Build/tests/services/api/working_set/test_manual_resolution_access_control.py
          --ignore=../OspreyFlow_Build/tests/services/api/working_set/test_resolution_threshold_access_control.py
          --ignore=../OspreyFlow_Build/tests/scenarios/test_phase7_stage6c_watch_routes.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_assessments.py
          --ignore=../OspreyFlow_Build/tests/test_case_seed.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_investigation_access_store.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_link_notes_store.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_suppression.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_assessment_routes.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_export.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_export_routes.py
          --ignore=../OspreyFlow_Build/tests/scenarios/test_fixture_corp_shape.py
          --ignore=../OspreyFlow_Build/tests/services/api/test_worker.py --ignore=../OspreyFlow_Build/tests/services/api/test_worker_replicas.py --ignore=../OspreyFlow_Build/tests/services/api/test_revoked_principal_precheck.py
          --ignore=../OspreyFlow_Build/tests/harness/test_restore_exit_test.py
          --ignore=../OspreyFlow_Build/tests/harness/test_workspace_bundle.py
          --ignore=../OspreyFlow_Build/tests/harness/test_bundle_exit_test.py
          --ignore=../OspreyFlow_Build/tests/harness/test_harness_image.py
          --ignore=../OspreyFlow_Build/tests/harness/test_sustained_load.py
          --ignore=../OspreyFlow_Build/tests/harness/test_six_screen_live_exit.py
          --ignore=../OspreyFlow_Build/tests/scenarios/test_phase8_exit_over_the_wire.py
          --ignore=../OspreyFlow_Build/tests/scenarios/test_phase8_exit_criterion_end_to_end.py
      # The Glass's fast, no-live-infra unit tests (`store.test.ts`,
      # `zoomBands.test.ts`) — `*.integration.test.ts` is excluded by
      # `vitest.config.ts` and runs in the `conformance` job instead.
      - run: npm test --workspace apps/workspace
      # The setup harness's own fast unit tier — `Stage 2 §6` part A
      # (`registryCoverage.test.ts`, the same shape the Glass's own already covers above).
      - run: npm test --workspace apps/harness

  # `process/07_BUILD_PLAN.md` Phase 4's exit criterion, the parts "not
  # asserted in prose": the §5 performance budget, the §6 contrast floor,
  # and "keyboard navigation reaches every canvas action" — all three as
  # CI gates. Needs a real (if software-rendered — no GPU on a hosted
  # runner) browser, so this is Playwright, not vitest; see `perf/
  # perf.spec.ts`'s module docstring for the two-tier performance
  # measurement decision (a CI regression proxy here, the literal §5
  # numbers verified once against real hardware as this phase's own exit
  # evidence).
  glass-perf-a11y-keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: OspreyFlow_Core/apps/workspace
      - run: npm run test:perf --workspace apps/workspace
      - run: npm run test:a11y --workspace apps/workspace
      - run: npm run test:keyboard --workspace apps/workspace

  # `06_DECISIONS.md` ADR-049 Stage 2 §6 part A, amendment 21 — the setup screens' own keyboard
  # spec, against a real `harness.webapp` server (`apps/harness/keyboard/playwright.config.ts`'s
  # own `webServer` array starts it alongside Vite). A separate job from `glass-perf-a11y-keyboard`
  # above, not a fourth step in it: this is the only Playwright suite in this repository that also
  # needs a live Python process, so it needs `astral-sh/setup-uv` too. `test:a11y` (Stage 2 §6 part
  # C, amendment 24) joined as a second step 26 September 2026, same reason: it drives the same
  # real `App` against the same real `harness.webapp`, so it shares this job's own setup rather
  # than duplicating it in a second one.
  harness-keyboard-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: OspreyFlow_Core/apps/harness
      - run: npm run test:keyboard --workspace apps/harness
      - run: npm run test:a11y --workspace apps/harness

  # Phase 8's two deployment-level exit tests. Neither can run in any job above: they do not need a
  # store, they need a **whole rendered deployment** — ten containers, images built from this
  # checkout, a realm imported, both fixtures seeded — which is the thing they exist to test.
  #
  # `OspreyFlow_Build/tests/scenarios/test_phase8_exit_criterion_end_to_end.py` had been reachable by no job at all
  # since it was written; `test-file-coverage-check` had been red on it. The restore exit test was
  # invisible to that gate entirely until 24 September 2026, because every marker the gate knew was
  # a Python import and this test reaches its services by shelling out to `docker compose`.
  #
  # **This job has never been observed running here.** It was built and run locally, repeatedly and
  # green; GitHub Actions cannot be executed from where it was written. Its first run in CI is the
  # untested state `CLAUDE.md` rule 15 names, and it should be treated as such until a run is on
  # record — in particular `--no-build` is NOT passed, so this is also the first CI-side build of
  # every owned image in one job.
  deployment-exit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Render, build, launch and seed a local-lite deployment
        run: |
          PYTHONPATH=.:packages:../OspreyFlow_Build uv run python -m harness.apply \
            --profile local-lite --build --seed hmp,fixture-corp
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - name: The built Glass bundle carries no Conduit address
        env:
          OSPREY_TEST_BUNDLE: "1"
        run: >-
          PYTHONPATH=.:packages:../OspreyFlow_Build uv run pytest -c ../OspreyFlow_Build/pytest.ini -p no:randomly
          ../OspreyFlow_Build/tests/harness/test_workspace_bundle.py
      - name: Exit test #1 — backup, destroy, restore, deep comparison
        env:
          OSPREY_TEST_COMPOSE_FILE: deploy/generated/local-lite/compose.yaml
        run: >-
          PYTHONPATH=.:packages:../OspreyFlow_Build uv run pytest -c ../OspreyFlow_Build/pytest.ini -p no:randomly
          ../OspreyFlow_Build/tests/harness/test_restore_exit_test.py
          ../OspreyFlow_Build/tests/scenarios/test_phase8_exit_criterion_end_to_end.py
      - name: Tear down
        if: always()
        run: >-
          docker compose --env-file deploy/generated/local-lite/deployment.env
          -f deploy/generated/local-lite/compose.yaml down -v --remove-orphans

  # Owner ruling R5, 27 September 2026 — the closing-pass proof of "both acceptance scenarios pass
  # on local-lite", taken **through the analyst's own door**: real Keycloak sign-in (authorization
  # code with PKCE, as the `--demo-analyst` subject), every call through the workspace's nginx, no
  # store port and no in-process app. `OspreyFlow_Build/tests/scenarios/test_phase8_exit_over_the_wire.py`'s own
  # module docstring has the row-by-row coverage and the two findings it exists to surface.
  #
  # **A separate job from `deployment-exit-tests` above, for the same reason every other exit test
  # here has one** — the identical `osprey-local-lite` project name and host ports collide — and
  # for one more: this deployment must be applied `--demo-analyst`, which the job above
  # deliberately does not, since a headless exit test needs no sign-in-able subject and a
  # deployment should not provision one it does not need.
  #
  # **Run once against a freshly seeded deployment**, never twice against the same one: two rows
  # make assertions the platform deliberately does not let a caller take back (the test's own
  # docstring says which, and why that is correct behaviour). A fresh runner is exactly that.
  over-the-wire-exit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Render, build, launch and seed a local-lite deployment with a demo analyst
        run: |
          PYTHONPATH=.:packages:../OspreyFlow_Build uv run python -m harness.apply \
            --profile local-lite --build --demo-analyst --seed hmp,fixture-corp,scenarios \
            | tee apply.log
          # The seeded investigation id has no discoverable route (the Conduit has no "list
          # investigations", by design), so it is taken from the URL `apply` prints — the same
          # line an operator reads it off.
          echo "OSPREY_LIVE_INVESTIGATION_ID=$(
            grep -o 'investigation=[0-9A-Z]*' apply.log | head -1 | cut -d= -f2
          )" >> "$GITHUB_ENV"
      - name: Both acceptance scenarios, over the wire, as the signed-in demo analyst
        env:
          OSPREY_TEST_OVER_THE_WIRE: "1"
        run: >-
          PYTHONPATH=.:packages:../OspreyFlow_Build uv run pytest -c ../OspreyFlow_Build/pytest.ini -p no:randomly
          ../OspreyFlow_Build/tests/scenarios/test_phase8_exit_over_the_wire.py
      - name: Tear down
        if: always()
        run: >-
          docker compose --env-file deploy/generated/local-lite/deployment.env
          -f deploy/generated/local-lite/compose.yaml down -v --remove-orphans

  # ADR-049 Stage 2 §5b's own exit test #3 — "install from the bundle, not the clone." A separate
  # job, not a further step above: both render the identical `osprey-local-lite` compose project
  # name (`harness.render`'s own `name: f"osprey-{profile}"`) and publish the identical host ports,
  # so running this after `deployment-exit-tests`' own already-up deployment in the same job would
  # collide rather than exercise anything new. A fresh runner is simpler than sequencing a teardown
  # between them correctly. This test's own `finally` block tears down what it starts, so no
  # further "Tear down" step is needed here the way the job above needs one.
  bundle-install-exit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Build the bundle with --images, install from it alone, and deploy
        env:
          OSPREY_TEST_DIST_BUNDLE: "1"
        run: >-
          PYTHONPATH=.:packages:../OspreyFlow_Build uv run pytest -c ../OspreyFlow_Build/pytest.ini -p no:randomly
          ../OspreyFlow_Build/tests/harness/test_bundle_exit_test.py

  # `05_DEPLOYMENT.md` §8 / `07_BUILD_PLAN.md` Stage 2a addendum's own named-not-built test, built.
  # A separate job for the same reason `bundle-install-exit-test` above is one: this renders the
  # identical `osprey-local-lite` compose project name and host ports, so sharing a job with
  # `deployment-exit-tests` would collide rather than exercise anything new. Six real seed-and-query
  # cycles against one accumulating database — `OspreyFlow_Build/tests/harness/test_sustained_load.py`'s own module
  # docstring has the runtime budget (up to ~40 minutes) this job's own timeout is sized against.
  # This test's own `finally` block tears down what it starts, so no further "Tear down" step here.
  sustained-load-exit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Six seed-and-query cycles against one accumulating local-lite database
        env:
          OSPREY_TEST_SUSTAINED_LOAD: "1"
        run: >-
          PYTHONPATH=.:packages:../OspreyFlow_Build uv run pytest -c ../OspreyFlow_Build/pytest.ini -p no:randomly
          ../OspreyFlow_Build/tests/harness/test_sustained_load.py

  # ADR-049 Stage 2 §6's own exit — the one item `REPORT-03d.md` left owed: Launch from the six
  # real setup screens (not `harness.apply` in-process, unlike the job above) reaches a
  # health-checked `local-lite` deployment that `harness.verify` passes three-sided. A separate
  # job for the same reason `bundle-install-exit-test`/`sustained-load-exit-test` each are: the
  # identical `osprey-local-lite` compose project name and host ports would collide with any of
  # them sharing a job.
  # **The five token-exchange tests, against a real Keycloak — round 13cc, owner ruling R8.**
  #
  # These had never run in any tier: nothing set OSPREY_TEST_KEYCLOAK_URL and the realm lived in a
  # /tmp script that was never in the tree. They guard PrincipalResolver's OAuth2 Token Exchange
  # and the revoked-principal precheck — the code path CLAUDE.md rule 15's second worked example
  # records as having shipped broken against a real IdP, because its only fixture was more
  # permissive than the real server. Tests that never execute are not evidence.
  #
  # The realm is this repository's own (harness/realm.py + harness/keycloak_admin.py), not one
  # built to suit the test.
  token-exchange-idp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: The five token-exchange tests against a real Keycloak
        run: make idp-test PY="uv run python" PYTEST="uv run pytest -c ../OspreyFlow_Build/pytest.ini"

  six-screen-live-exit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Drive the six setup screens by real HTTP route through to a verified Launch
        env:
          OSPREY_TEST_SIX_SCREEN_EXIT: "1"
        run: >-
          PYTHONPATH=.:packages:../OspreyFlow_Build uv run pytest -c ../OspreyFlow_Build/pytest.ini -p no:randomly
          ../OspreyFlow_Build/tests/harness/test_six_screen_live_exit.py
      - name: Tear down
        if: always()
        run: >-
          docker compose -p osprey-local-lite down -v --remove-orphans

  # Stage 2 §5b's own harness bootstrap image (`harness/Dockerfile`) — the image builds, and
  # `docker run ... preflight --gate` from it reaches the same result as the host CLI (one named,
  # measured exception: `OspreyFlow_Build/tests/harness/test_harness_image.py`'s own module docstring has the
  # memory-check discrepancy this comparison excludes and why). A separate job from both above:
  # it builds its own image and runs no compose stack at all, so it neither needs nor risks the
  # port/project-name collisions the other two jobs' own comments already explain.
  harness-image-exit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Build the harness image and compare its preflight to the host CLI's
        env:
          OSPREY_TEST_HARNESS_IMAGE: "1"
        run: >-
          PYTHONPATH=.:packages:../OspreyFlow_Build uv run pytest -c ../OspreyFlow_Build/pytest.ini -p no:randomly
          ../OspreyFlow_Build/tests/harness/test_harness_image.py
