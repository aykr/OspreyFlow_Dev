<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ingest Studio — Map screen (throwaway prototype)</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1c1f24;
    --dim: #6b7280;
    --line: #d7dbe0;
    --panel: #ffffff;
    --ground: #f4f5f7;
    --accent: #2a5fb0;
    --accent-bg: #eaf1fc;
    --warn: #b3540a;
    --warn-bg: #fdf1e6;
    --bad: #a8322d;
    --bad-bg: #fbeceb;
    --dup: #6b6f76;
    --dup-bg: #f0f1f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 10px 16px;
    background: #20242b;
    color: #e7e9ec;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  header .badge {
    background: #b3540a;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    padding: 2px 8px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  header .meta { color: #9aa1ac; font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 220px 1fr 300px;
    gap: 1px;
    background: var(--line);
    min-height: calc(100vh - 46px);
  }
  section { background: var(--panel); padding: 12px; overflow: auto; min-width: 0; }
  h2 {
    margin: 0 0 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--dim);
  }
  .field {
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 6px;
    cursor: default;
  }
  .field .name { font-weight: 600; }
  .field .val { color: var(--dim); font-size: 12px; word-break: break-all; }
  .field.unmapped { border-style: dashed; background: var(--warn-bg); }
  .field.unmapped .name::after {
    content: " · unmapped";
    font-weight: 400;
    color: var(--warn);
    font-size: 11px;
  }

  .template { display: flex; flex-direction: column; gap: 28px; }
  .row-status {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 2px 8px;
    border-radius: 3px;
  }
  .row-status.loaded { background: var(--accent-bg); color: var(--accent); }
  .row-status.duplicate { background: var(--dup-bg); color: var(--dup); }
  .row-status.rejected { background: var(--bad-bg); color: var(--bad); }
  .reason { color: var(--bad); font-size: 12.5px; margin-top: 6px; }

  .graph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .node {
    border: 2px solid var(--accent);
    background: var(--accent-bg);
    border-radius: 10px;
    padding: 10px 12px;
    min-width: 150px;
    cursor: pointer;
  }
  .node.selected { outline: 3px solid #14304f; }
  .node .ref { font-size: 10px; color: var(--dim); text-transform: uppercase; }
  .node .type { font-weight: 700; margin: 2px 0 6px; }
  .node .prop { font-size: 12px; }
  .node .prop b { font-weight: 600; }
  .edge {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 11px;
    color: var(--dim);
    min-width: 90px;
  }
  .edge .arrow { font-size: 20px; color: var(--ink); }
  .edge .label { font-weight: 700; color: var(--ink); cursor: pointer; }
  .edge .label.selected { text-decoration: underline; }

  #inspectorBody .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin-bottom: 10px; }
  #inspectorBody .kv div:nth-child(odd) { color: var(--dim); }
  #inspectorBody pre {
    background: var(--ground);
    padding: 8px;
    border-radius: 4px;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-all;
    width: 100%;
    max-width: 260px;
  }
  .binding-list { list-style: none; padding: 0; margin: 0; }
  .binding-list li {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 8px;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  .binding-list .bname { font-weight: 700; }
  .binding-list .bexpr { color: var(--accent); font-family: ui-monospace, monospace; }

  .pager {
    padding: 10px 16px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  button {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font: inherit;
  }
  button:disabled { opacity: .4; cursor: default; }
  .empty-hint { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<header>
  <span class="badge">Throwaway prototype</span>
  <strong>Ingest Studio — Map screen</strong>
  <span class="meta" id="recipeMeta"></span>
</header>
<main>
  <section id="sourcePane"><h2>Source fields</h2><div id="fieldList"></div></section>
  <section id="templatePane"><h2>Row template — what one record becomes</h2><div id="templateBody"></div></section>
  <section id="inspectorPane"><h2>Inspector</h2><div id="inspectorBody"><p class="empty-hint">Select an entity or edge.</p></div></section>
</main>
<div class="pager">
  <button id="prevRow">◂</button>
  <span id="rowLabel"></span>
  <button id="nextRow">▸</button>
  <span class="empty-hint" id="summaryLabel" style="margin-left:16px;"></span>
</div>
<script src="app.js"></script>
</body>
</html>
