[project]
name = "ospreyflow"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25.0.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "python-ulid>=3.0",
    "httpx>=0.27",
    "duckdb>=1.1",
    "phonenumbers>=8.13",
    "pyproj>=3.6",
    "python-dateutil>=2.9",
    "valkey>=6.1.1",
    "msgpack>=1.2.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pyjwt>=2.14.0",
    "cryptography>=50.0.1",
    "asyncpg>=0.31.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
    "pip-licenses>=5.0",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
    "types-python-dateutil>=2.9",
]

[tool.pytest.ini_options]
pythonpath = ["packages"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
mypy_path = "packages"
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msgpack.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
src = ["packages", "services", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false
