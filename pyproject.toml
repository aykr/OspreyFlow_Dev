[project]
name = "mantisnexus"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25.0.1",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.7",
    "pip-licenses>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["packages"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "packages"
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
src = ["packages", "services", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false
