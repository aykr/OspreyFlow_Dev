# The licence register for what the code gate does not see: model weights, map data, font files and
# base images (PL11; the owner's rulings of 21 November 2026). `00_ARCHITECTURE.md` §7 is the
# allowlist for code and stays as it is; this register is the second half of the licence story.
#
# WHY YAML, beside the prose: the gate (`tools/licence_register.py`, called from
# `tools/licence_check.py`) reads the rows, and a table in Markdown would have to be parsed back out
# of its formatting. The prose is §7's "Licence register for weights, map data, fonts and base
# images" and the comments here.
#
# THE DEFINITION each row is judged by (the owner, 21 November 2026): software and base images are
# open source when their licence is approved by the Open Source Initiative (which includes GPL-2.0
# with the Classpath exception); model weights, by the same test on the weights' own licence; data,
# by a recognised open-data licence, which covers ODbL and OGL. The `test` column says which test a
# row passed: `osi-software`, `osi-weights`, `open-data`, or `restricted` (the name of failing).
#
# COLUMNS: id; kind (weight | map-data | font | image); name (as the code writes it: the gate matches
# on it); pin (the version, digest, revision or hash the code pins: the gate compares it to the
# code's); ships (what ships or fetches it, and when); named_in (files, relative to OspreyFlow_Core);
# licence (as stated by the source); where_read (the source, at the pinned version, and the day it was
# read); test; status. Optional: note; owner_ruling (required of a `conditional` row); must_read (required
# of an `unconfirmed` row); os_packages (required of an image).
#
# STATUS: `confirmed` (read from the source at the pin); `unconfirmed` (this session could not read
# a source: no licence is written, `must_read` says exactly what to read); `conditional` (fails the
# definition, and ships only as the owner has ruled: it cites the ruling). The gate allows
# `unconfirmed`; the release check refuses a release while any is left, and while any name is in
# `HELD_FOR_OWNER` (`tools/licence_register.py`).
#
# A NAME HELD FOR THE OWNER is not a row: its licence, read at the pin, does not pass the definition
# and has not been ruled on. Today: ghcr.io/berriai/litellm (its image carries /app/enterprise under
# the BerriAI Enterprise licence). See `HELD_FOR_OWNER`.
#
# IMAGES: `os_packages.scan` says whether an existing scan covers the operating-system packages inside
# the image (yes | no | partly) and `covered_by` says how. The row's licence is the PROJECT's own, read at
# the pin. It is not a statement about every package in the image: no scan reads those licences
# (every row says so). `trivy` runs `scanners: vuln` on the product's own images, which finds
# vulnerabilities and reads no licence.
#
# READ ON 21 November 2026 with the session's network: registry manifests and blobs were read, not
# pulled or run; no image was started and no scan was run.

schema: 1

definitions:
  trivy_note: &trivy_vuln_only >-
    The release workflow's `trivy image` runs `scanners: vuln` (CVEs), and reads no package licence.
  third_party_no: &third_party_no
    scan: "no"
    covered_by: >-
      Not built by the product, so no scan of ours runs on it (the release matrix's `trivy image`,
      `scanners: vuln`, covers the product's own seven images and finds CVEs, not licences). Its
      operating-system packages' licences are not listed or checked by anything in this repository.
  osm_licence: &osm_where_read >-
    https://www.openstreetmap.org/copyright, read 21 November 2026: "OpenStreetMap is open data,
    licensed under the Open Data Commons Open Database License (ODbL) by the OpenStreetMap
    Foundation (OSMF)".

