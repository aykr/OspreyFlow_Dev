<text x="716" y="78" font-size="11" fill="#1f2a2e" font-weight="400" text-anchor="start">● Model v3</text>
<text x="806.4" y="78" font-size="11" fill="#1f2a2e" font-weight="400" text-anchor="start">● 6 sources</text>
<text x="903.5999999999999" y="78" font-size="11" fill="#1f2a2e" font-weight="400" text-anchor="start">● 4 pipelines · 1 untested</text>
<text x="1102.8" y="78" font-size="11" fill="#1f2a2e" font-weight="400" text-anchor="start">● last run 06:03 ✓</text>
<text x="20" y="626" font-size="10.5" fill="#6b767b" font-weight="400" text-anchor="start">Wireframe · 1 Model: the target data model, owned by the dataset · Ingest Studio redesign, draft for the owner, 4 November 2026</text>
<text x="20" y="124" font-size="15" fill="#1f2a2e" font-weight="700" text-anchor="start">Target model for Prison Intelligence Dataset  ·  version 3  ·  POLE core + Justice pack (NIEM v3) + 2 extensions</text>
<text x="20" y="144" font-size="12" fill="#6b767b" font-weight="400" text-anchor="start">Every pipeline that loads this dataset maps into this model. Changing it flags the pipelines that write the changed types.</text>
<rect x="20" y="164" width="330" height="300" rx="4" fill="#f3f5f6" stroke="#b9c2c6" stroke-width="1"/>
<text x="36" y="188" font-size="13" fill="#1f2a2e" font-weight="700" text-anchor="start">Starting point</text>
