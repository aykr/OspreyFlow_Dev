<text x="978" y="224" font-size="12" fill="#1f2a2e" font-weight="700" text-anchor="start">Wings</text>
<text x="978" y="242" font-size="11" fill="#6b767b" font-weight="400" text-anchor="start">12 rows · v2 · key: wing_code</text>
