<text x="900" y="188" font-size="11" fill="#6b767b" font-weight="400" text-anchor="end">Search types…</text>
<text x="386" y="214" font-size="10.5" fill="#0097A7" font-weight="700" text-anchor="start">PERSON</text>
<text x="386" y="236" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">Person</text>
<text x="386" y="256" font-size="12" fill="#b47b2b" font-weight="400" text-anchor="start">  + prisoner_number (ext.)</text>
<text x="386" y="276" font-size="12" fill="#b47b2b" font-weight="400" text-anchor="start">  + wing (ext.)</text>
