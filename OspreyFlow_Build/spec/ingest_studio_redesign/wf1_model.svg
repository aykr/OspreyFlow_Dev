<text x="521" y="296" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">Document</text>
<text x="656" y="214" font-size="10.5" fill="#0097A7" font-weight="700" text-anchor="start">LOCATION</text>
<text x="656" y="236" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">Location</text>
<text x="656" y="256" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">Establishment</text>
<text x="791" y="214" font-size="10.5" fill="#0097A7" font-weight="700" text-anchor="start">EVENT</text>
<text x="791" y="236" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">Incident</text>
<text x="791" y="256" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">Visit</text>
<text x="791" y="276" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">Call</text>
<text x="386" y="340" font-size="11" fill="#1f2a2e" font-weight="400" text-anchor="start">Links: COMMUNICATED_WITH · SHARED_CELL_WITH · VISITED · HELD_AT · USES · IN_CONFLICT_WITH …</text>
<rect x="386" y="360" width="528" height="86" rx="4" fill="#ffffff" stroke="#b9c2c6" stroke-width="1" stroke-dasharray="4 3"/>
<text x="400" y="382" font-size="12" fill="#1f2a2e" font-weight="700" text-anchor="start">Extensions (this dataset only)</text>
<text x="400" y="402" font-size="11" fill="#1f2a2e" font-weight="400" text-anchor="start" font-family="Menlo, Consolas, monospace">Person.prisoner_number  identifier · Z####ZZ    Person.wing  property · list 'Wings'</text>
<text x="400" y="422" font-size="11" fill="#005299" font-weight="400" text-anchor="start">+ Add a property   + Add an identifier   + Add a link type  (expert mode: + Add an entity type)</text>
