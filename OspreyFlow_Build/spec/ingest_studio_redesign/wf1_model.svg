<text x="58" y="212" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">POLE core (always on)</text>
<rect x="36" y="230" width="14" height="14" rx="3" fill="#005299" stroke="#005299" stroke-width="1"/>
<text x="58" y="242" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">Justice and public safety pack</text>
<rect x="36" y="260" width="14" height="14" rx="3" fill="#ffffff" stroke="#b9c2c6" stroke-width="1"/>
<text x="58" y="272" font-size="12" fill="#6b767b" font-weight="400" text-anchor="start">Financial crime and AML pack</text>
<rect x="36" y="290" width="14" height="14" rx="3" fill="#ffffff" stroke="#b9c2c6" stroke-width="1"/>
<text x="58" y="302" font-size="12" fill="#6b767b" font-weight="400" text-anchor="start">Cyber threat pack</text>
<rect x="36" y="320" width="14" height="14" rx="3" fill="#ffffff" stroke="#b9c2c6" stroke-width="1"/>
<text x="58" y="332" font-size="12" fill="#6b767b" font-weight="400" text-anchor="start">Blank: POLE core only</text>
<text x="36" y="384" font-size="11" fill="#6b767b" font-weight="400" text-anchor="start">Accelerator packs add types; they never</text>
<text x="36" y="400" font-size="11" fill="#6b767b" font-weight="400" text-anchor="start">remove or rename a POLE type.</text>
<rect x="36" y="420" width="115" height="28" rx="4" fill="#ffffff" stroke="#b9c2c6" stroke-width="1"/>
<text x="93.5" y="438" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="middle">Change packs…</text>
<rect x="370" y="164" width="560" height="300" rx="4" fill="#f3f5f6" stroke="#b9c2c6" stroke-width="1"/>
