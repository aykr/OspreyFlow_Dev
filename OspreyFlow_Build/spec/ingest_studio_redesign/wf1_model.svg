<text x="1352" y="278" font-size="10.5" fill="#0097A7" font-weight="400" text-anchor="end">used by 3 pipelines</text>
<rect x="966" y="316" width="398" height="44" rx="4" fill="#ffffff" stroke="#b9c2c6" stroke-width="1"/>
<text x="978" y="332" font-size="12" fill="#1f2a2e" font-weight="700" text-anchor="start">UK Sanctions List (synthetic)</text>
<text x="978" y="350" font-size="11" fill="#6b767b" font-weight="400" text-anchor="start">5 rows · v28/09 · screening</text>
<text x="1352" y="332" font-size="10.5" fill="#0097A7" font-weight="400" text-anchor="end">re-screens on change</text>
<rect x="966" y="392" width="171" height="28" rx="4" fill="#ffffff" stroke="#b9c2c6" stroke-width="1"/>
<text x="1051.5" y="410" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="middle">+ Add a list from CSV</text>
<text x="966" y="440" font-size="11" fill="#6b767b" font-weight="400" text-anchor="start">A list is a table with a key: usable in a Lookup step, a Map binding,</text>
<text x="966" y="456" font-size="11" fill="#6b767b" font-weight="400" text-anchor="start">and (if marked screening) by the monitoring rules.</text>
<rect x="20" y="484" width="1360" height="110" rx="4" fill="#f3f5f6" stroke="#b9c2c6" stroke-width="1"/>
<text x="36" y="508" font-size="13" fill="#1f2a2e" font-weight="700" text-anchor="start">Versions and impact</text>
<text x="36" y="532" font-size="12" fill="#1f2a2e" font-weight="400" text-anchor="start">v3 (current, 2 Nov)  added Establishment, HELD_AT · v2 (27 Oct)  added prisoner_number · v1 (18 Oct)  POLE + Justice pack</text>
<text x="36" y="556" font-size="11.5" fill="#6b767b" font-weight="400" text-anchor="start">If you change a type a pipeline writes, that pipeline is marked 'needs attention' and its schedule pauses until it is re-tested and re-deployed (today's flagging, unchanged).</text>
<rect x="36" y="566" width="143" height="28" rx="4" fill="#005299" stroke="#005299" stroke-width="1"/>
