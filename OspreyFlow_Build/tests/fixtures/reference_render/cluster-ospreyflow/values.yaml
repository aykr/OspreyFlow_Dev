  theme--login--resources--css--osprey.css: ":root {\n  --reference-render-token: pinned;\n}\n\n/* --- Keycloak sign-in page, restyled from the tokens above. ------------------------------- */\nhtml, body, .login-pf, .login-pf-page, .pf-v5-c-login {\n  background-color: var(--surface-app) !important;\n  background-image: none !important;\n  color: var(--text-primary);\n  font-family: var(--ui);\n}\n/* The page is centred, so the card does not sit high on a tall window. */\n.pf-v5-c-login {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  align-items: center;\n  min-height: 100vh;\n}\n.pf-v5-c-login__container {\n  display: block;\n  box-sizing: border-box;\n  width: 100%;\n  max-width: 26rem;\n  margin-inline: auto;\n  padding: var(--sp-40) var(--sp-24);\n}\n/* Keycloak's own sheet puts the header in a second grid column from 1200px up, which left the name\n   floating to the right of the card. One column, header first, above the card, a set distance\n   away. */\n.pf-v5-c-login__header {\n  grid-column: 1;\n  grid-row: 1;\n  margin: 0 0 var(--sp-24);\n  padding: 0;\n  text-align: left;\n}\n/* The brand's horizontal lockup (spec/design/OspreyFlow_Brand_Foundations.html): the mark, a gap of\n   a third of its width, then the wordmark at the screen-title size, Osprey bold and Flow regular.\n   Keycloak 26 prints the header into `#kc-header-wrapper`; the mark is a mask over a block, so its\n   colour is a token and it follows light and dark. */\n#kc-header-wrapper {\n  --lockup-mark: 36px;\n  display: flex;\n  align-items: center;\n  gap: calc(var(--lockup-mark) / 3);\n  padding: 0;\n  color: var(--text-primary);\n  font: 400 var(--fs-23) / var(--lh-23) var(--ui);\n  letter-spacing: -0.01em;\n  text-align: left;\n}\n#kc-header-wrapper b { font-weight: 700; }\n#kc-header-wrapper::before {\n  content: \"\";\n  flex: none;\n  display: block;\n  width: var(--lockup-mark);\n  height: var(--lockup-mark);\n  background-color: var(--text-primary);\n  -webkit-mask: url(\"data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Cpath%20d='M4.9%206.7L6.4%2017.2L23.9%2011.1Z'/%3E%3Cpath%20d='M6.8%2017.9L24.3%2019.9L24.2%2011.7Z'/%3E%3Cpath%20d='M6.6%2018.6L8%2029.1L24.2%2020.7Z'/%3E%3Cpath%20d='M8.4%2030.1L9.4%2041L24.4%2021.2Z'/%3E%3Cpath%20d='M9.8%2041.2L24.4%2030.2L24.7%2021.5Z'/%3E%3Cpath%20d='M25.6%2011.9L26.2%2029.2L43.9%2025.7Z'/%3E%3C/svg%3E\") center / contain no-repeat;\n  mask: url(\"data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Cpath%20d='M4.9%206.7L6.4%2017.2L23.9%2011.1Z'/%3E%3Cpath%20d='M6.8%2017.9L24.3%2019.9L24.2%2011.7Z'/%3E%3Cpath%20d='M6.6%2018.6L8%2029.1L24.2%2020.7Z'/%3E%3Cpath%20d='M8.4%2030.1L9.4%2041L24.4%2021.2Z'/%3E%3Cpath%20d='M9.8%2041.2L24.4%2030.2L24.7%2021.5Z'/%3E%3Cpath%20d='M25.6%2011.9L26.2%2029.2L43.9%2025.7Z'/%3E%3C/svg%3E\") center / contain no-repeat;\n}\n.pf-v5-c-login__main {\n  background: var(--surface-panel);\n  border: 1px solid var(--border-subtle);\n  border-radius: var(--r-panel);\n  box-shadow: none;\n  color: var(--text-primary);\n}\n.pf-v5-c-login__main-header, .pf-v5-c-login__main-body, .pf-v5-c-login__main-footer {\n  background: transparent;\n  color: var(--text-primary);\n}\n.pf-v5-c-login__main-header { padding: var(--sp-32) var(--sp-32) 0; }\n.pf-v5-c-login__main-body { padding: var(--sp-16) var(--sp-32) var(--sp-32); }\n.pf-v5-c-title, #kc-page-title, h1 {\n  color: var(--text-primary);\n  font: 700 var(--fs-23) / var(--lh-23) var(--ui);\n}\n.pf-v5-c-form { --pf-v5-c-form--GridGap: var(--sp-20); row-gap: var(--sp-20); }\n.pf-v5-c-form__label { padding-block-end: var(--sp-8); }\n.pf-v5-c-form__label-text, label {\n  color: var(--text-secondary);\n  font: 600 var(--fs-13) / var(--lh-13) var(--ui);\n}\n.pf-v5-c-form-control {\n  background: var(--surface-raised);\n  border: 1px solid var(--border);\n  border-radius: var(--r-control);\n  color: var(--text-primary);\n}\n.pf-v5-c-form-control::before, .pf-v5-c-form-control::after { display: none; }\n.pf-v5-c-form-control input,\
    \ .pf-v5-c-form-control select {\n  background: transparent;\n  color: var(--text-primary);\n  font-family: var(--ui);\n}\n/* One ring. The tokens give every focused element an outline of its own; the input inside the box\n   would wear it as a second ring, so it carries none and the box shows a single one. */\n.pf-v5-c-form-control input:focus-visible, .pf-v5-c-form-control select:focus-visible {\n  outline: none;\n}\n.pf-v5-c-form-control:focus-within {\n  border-color: var(--brass);\n  box-shadow: 0 0 0 1px var(--brass);\n}\n/* The password box and its show button are one control: equal height, no seam, no underline. */\n.pf-v5-c-input-group { display: flex; align-items: stretch; }\n.pf-v5-c-input-group .pf-v5-c-form-control { flex: 1 1 auto; min-width: 0; }\n.pf-v5-c-input-group .pf-v5-c-button {\n  background: var(--surface-raised);\n  border: 1px solid var(--border);\n  border-left: 0;\n  border-radius: 0 var(--r-control) var(--r-control) 0;\n  color: var(--text-secondary);\n}\n.pf-v5-c-input-group .pf-v5-c-button::before, .pf-v5-c-input-group .pf-v5-c-button::after {\n  display: none;\n}\n.pf-v5-c-input-group .pf-v5-c-form-control:not(:last-child) {\n  border-radius: var(--r-control) 0 0 var(--r-control);\n}\n.pf-v5-c-button.pf-m-primary {\n  background: var(--brass);\n  border: 1px solid var(--brass);\n  border-radius: var(--r-control);\n  color: var(--brass-ink);\n  font: 600 var(--fs-14) / var(--lh-14) var(--ui);\n  padding: var(--sp-12) var(--sp-16);\n  transition: background var(--dur-fast) var(--ease);\n}\n.pf-v5-c-button.pf-m-primary:hover {\n  background: var(--brass-hover);\n  border-color: var(--brass-hover);\n}\n.pf-v5-c-button.pf-m-primary:active { background: var(--brass-press); }\n#kc-form-buttons { margin-top: var(--sp-8); }\n.pf-v5-c-button.pf-m-control, .pf-v5-c-button.pf-m-plain {\n  background: transparent;\n  border-color: var(--border);\n  color: var(--text-secondary);\n}\n.pf-v5-c-alert {\n  background: var(--surface-raised);\n  border: 1px solid var(--border);\n  color: var(--text-primary);\n}\n.pf-v5-c-alert.pf-m-danger { border-color: var(--error); }\n.pf-v5-c-alert.pf-m-warning { border-color: var(--warning); }\n.pf-v5-c-alert.pf-m-success { border-color: var(--success); }\n.pf-v5-c-helper-text__item-text, .pf-m-error { color: var(--error); }\n.pf-v5-c-login__main-footer-links a, .pf-v5-c-login__main-footer-band a { color: var(--brass); }\na { color: var(--brass); }\na:hover { color: var(--brass-hover); }\n\n/* --- ADR-115 E2: the handoff's sign-in card. ----------------------------------------------- */\n.pf-v5-c-login__main-header .pf-v5-c-title, #kc-page-title {\n  font: 700 var(--fs-19) / var(--lh-19) var(--ui);\n}\n.pf-v5-c-form-control {\n  background: var(--surface-sunken);\n  min-height: var(--h-control-32);\n}\n.pf-v5-c-form-control input {\n  font: 400 var(--fs-13) / var(--lh-13) var(--mono); letter-spacing: -0.005em;\n}\n.pf-v5-c-form-control:has(input[aria-invalid=\"true\"]) { border-color: var(--error); }\n.pf-v5-c-button.pf-m-primary { min-height: var(--h-control-36); width: 100%; font-weight: 700; }\n/* The reset page's \"Back to sign in\": the handoff's quiet text button, not PatternFly's outline. */\n.pf-v5-c-button.pf-m-secondary {\n  align-self: flex-start; width: auto; min-height: 0; padding: 0;\n  background: none; border: 0; border-bottom: 1px solid var(--border-strong); border-radius: 0;\n  color: var(--text-secondary); font: 400 var(--fs-13) / var(--lh-13) var(--ui);\n}\n.pf-v5-c-button.pf-m-secondary::after { display: none; }\n.pf-v5-c-button.pf-m-secondary:hover { color: var(--brass); border-bottom-color: var(--brass); }\n.osprey-lead {\n  margin: 0 0 var(--sp-16); color: var(--text-tertiary);\n  font: 400 var(--fs-13) / var(--lh-13) var(--ui);\n}\n/* Keycloak's sheet gives the form `display: grid`, which beats the `hidden` attribute. */\n#kc-form-login[hidden] { display: none !important; }\n.osprey-field-error {\n  display: block; margin-top: var(--sp-6);\n  color: var(--error); font: 400 var(--fs-12) / var(--lh-12) var(--ui);\n}\n.osprey-no-reset, .osprey-card-foot\
    \ {\n  margin: var(--sp-8) 0 0; color: var(--text-tertiary);\n  font: 400 var(--fs-12) / var(--lh-12) var(--ui);\n}\n.osprey-card-foot {\n  margin-top: var(--sp-16); padding-top: var(--sp-4); border-top: 1px solid var(--border-subtle);\n}\n.osprey-back {\n  width: 100%; min-height: var(--h-control-34); margin-top: var(--sp-16);\n  background: var(--surface-raised); border: 1px solid var(--border);\n  border-radius: var(--r-control);\n  color: var(--text-primary); font: 600 var(--fs-13) / var(--lh-13) var(--ui);\n}\n"
  theme--login--messages--messages_en.properties: 'loginAccountTitle=Sign in

    loginTitleHtml=<span class="osprey-wordmark"><b>Osprey</b>Flow</span>

    doLogIn=Sign in

    usernameOrEmail=Email or username

    doForgotPassword=Forgot password?

    emailForgotTitle=Reset your password

    emailInstruction=For OspreyFlow accounts only. If you sign in through your organisation, reset your password there instead.

    backToLogin=Back to sign in

    invalidUserMessage=That email or username and password do not match an OspreyFlow account. Check for typos, or ask your OspreyFlow administrator to reset your sign-in. Five failed attempts lock the account for 15 minutes.

    emailSentMessage=If an OspreyFlow account matches what you entered, a reset link is on its way to the email address on that account. It expires in 30 minutes. Nothing after five minutes? Check your junk folder, or ask your administrator to confirm the address on your account.

    ospreyAccountExistsMessage=This email address already belongs to an OspreyFlow account, so your organisation account has not been joined to it. Sign in to that account with its username and password instead, or ask your OspreyFlow administrator.

    '
  theme--login--resources--js--osprey-theme.js: "/* The light and dark choice for OspreyFlow's pages that are not React (ADR-072): the launcher's\n   welcome page and Keycloak's sign-in page. The Glass and the setup harness use\n   packages/glass-shared/src/theme/theme.ts, which reads and writes the same cookie.\n\n   The pages are on different names of one deployment (ADR-114 Amendment 4: the Glass at the base\n   name, this sign-in page at id., the dashboards at bi.), so the choice is a cookie kept for the\n   base name, which reaches all of them; packages/glass-shared/src/theme/theme.ts holds the same\n   rule. It holds only \"light\" or \"dark\" and no server reads it. Dark is the default. Written in plain ES5 with no dependency, since it is put in a page\n   as it is. Colours come only from the design tokens (var(--...)), which every one of these pages\n   already has. */\n(function () {\n  var NAME = \"ospreyflow_theme\";\n  var BUTTON_ID = \"osprey-theme-toggle\";\n  var root = document.documentElement;\n  /* WCAG 3.1.1: Keycloak's template writes `lang` only when the realm has internationalisation on,\n     which this realm does not. English, as the Glass's own index.html has it; a `lang` already\n     written is kept. */\n  if (!root.getAttribute(\"lang\")) root.setAttribute(\"lang\", \"en\");\n  /* Under the GOV.UK brand (ADR-132) the page is light only and there is no choice to offer: the\n     GOV.UK Design System has no dark mode. The sign-in theme marks the page before this runs. */\n  var GOVUK = root.getAttribute(\"data-brand\") === \"govuk\";\n\n  function read() {\n    try {\n      var match = document.cookie.match(new RegExp(\"(?:^|;\\\\s*)\" + NAME + \"=([^;]*)\"));\n      return match && (match[1] === \"light\" || match[1] === \"dark\") ? match[1] : null;\n    } catch (e) {\n      return null;\n    }\n  }\n\n  function current() {\n    return root.getAttribute(\"data-theme\") === \"light\" ? \"light\" : \"dark\";\n  }\n\n  function show(theme) {\n    if (GOVUK) theme = \"light\";\n    root.setAttribute(\"data-theme\", theme);\n    var button = document.getElementById(BUTTON_ID);\n    if (button) label(button, theme);\n  }\n\n  /* The button names the theme a press switches to: Light while the page is dark, Dark once it is\n     light. */\n  function label(button, theme) {\n    var next = theme === \"light\" ? \"dark\" : \"light\";\n    button.setAttribute(\"aria-label\", \"Switch to the \" + next + \" theme\");\n    button.title = \"Switch to the \" + next + \" theme\";\n    button.textContent = next === \"light\" ? \"\\u2600 Light\" : \"\\u263E Dark\";\n  }\n\n  /* The base name the choice is kept for, or null for localhost or an address, where a browser takes\n     no Domain and the choice is kept for the host alone. */\n  function cookieDomain(hostname) {\n    var host = String(hostname).toLowerCase().replace(/\\.$/, \"\");\n    if (host.indexOf(\".\") < 0 || /^[\\d.]+$/.test(host) || host.indexOf(\":\") >= 0 || host.charAt(0) === \"[\") {\n      return null;\n    }\n    return host.replace(/^(id|bi)\\./, \"\");\n  }\n\n  /* The assignments that keep the choice: a copy kept for this host alone (as the page wrote it before\n     the names) is cleared first, so it can never shadow the shared one. */\n  function cookieWrites(theme, hostname) {\n    var kept = NAME + \"=\" + theme + \"; Path=/; Max-Age=31536000; SameSite=Lax\";\n    var domain = cookieDomain(hostname);\n    return domain === null ? [kept] : [NAME + \"=; Path=/; Max-Age=0\", kept + \"; Domain=\" + domain];\n  }\n\n  function set(theme) {\n    if (GOVUK) return show(\"light\");\n    try {\n      var writes = cookieWrites(theme, window.location.hostname);\n      for (var i = 0; i < writes.length; i++) document.cookie = writes[i];\n    } catch (e) {\n      /* The page still changes; the choice just does not travel to the other pages. */\n    }\n    show(theme);\n  }\n\n  /* A button, drawn from the tokens, at the top right of the page, worded for the theme it switches to. */\n  function mountButton(parent) {\n    if (GOVUK) return null;\n \
    \   var existing = document.getElementById(BUTTON_ID);\n    if (existing) return existing;\n    var button = document.createElement(\"button\");\n    button.id = BUTTON_ID;\n    button.type = \"button\";\n    button.setAttribute(\n      \"style\",\n      \"position: fixed; top: var(--sp-12); right: var(--sp-12); z-index: 1000;\" +\n        \" padding: var(--sp-6) var(--sp-12); border: 1px solid var(--border);\" +\n        \" border-radius: var(--r-control); background: var(--surface-raised);\" +\n        \" color: var(--text-primary); font: inherit; font-size: var(--fs-13); cursor: pointer;\"\n    );\n    button.addEventListener(\"click\", function () {\n      set(current() === \"light\" ? \"dark\" : \"light\");\n    });\n    (parent || document.body).appendChild(button);\n    show(current());\n    return button;\n  }\n\n  show(read() || \"dark\");\n  window.ospreyTheme = { current: current, set: set, mountButton: mountButton, cookieWrites: cookieWrites };\n\n  if (document.body) {\n    mountButton();\n  } else {\n    document.addEventListener(\"DOMContentLoaded\", function () {\n      mountButton();\n    });\n  }\n})();\n"
  theme--login--resources--js--osprey-sign-in.js: "window.OSPREY_RESET_BY_EMAIL = false;\n/* The sign-in card's behaviour on Keycloak's own pages (ADR-115, Phase E stage E2).\n *\n * The Glass never takes a password (ADR-115 decision 4), so the handoff's email-or-username form is\n * Keycloak's, and this script gives it the handoff's behaviour: validation on submit, never on\n * keystroke, in the handoff's own words, each field in error marked for assistive technology; the\n * reset page's button saying what it sends; \"Check your email\" after a reset is sent; and, where the\n * deployment has no mail server, the way back named where the reset link would be (decision 6).\n *\n * Written against Keycloak 26.0.8's `keycloak.v2` markup, measured: `#kc-form-login` with\n * `#username`, `#password`; `#kc-reset-password-form` with `#username`; `#kc-page-title`.\n * `window.OSPREY_RESET_BY_EMAIL` is written before this file by `harness/keycloak_theme.py`.\n */\n(function () {\n  \"use strict\";\n\n  /* Under the GOV.UK brand the page is the service's, not OspreyFlow's (ADR-132 Amendment 2): the\n     theme marks it before this runs, and the words name no product. */\n  var PRODUCT = document.documentElement.getAttribute(\"data-brand\") === \"govuk\" ? \"\" : \"OspreyFlow \";\n\n  var SAY = {\n    emptyIdentifier: \"Enter your email address or username.\",\n    badAddress: \"Enter an email address in the format name@organisation.gov.uk, or use your username.\",\n    badUsername: \"Usernames use letters, numbers, dots, hyphens and underscores, with no spaces.\",\n    emptyPassword: \"Enter your password.\",\n    noReset:\n      \"Forgot your password? Ask your \" + PRODUCT + \"administrator to reset your sign-in. They'll give you a one-time code.\",\n    foot: \"No account yet? Your \" + PRODUCT + \"administrator invites people and assigns roles.\",\n    sendReset: \"Send reset link\",\n    checkEmail: \"Check your email\",\n    signIn: \"Sign in\",\n    back: \"Back to sign in\",\n    sentStarts: \"If an \" + PRODUCT + \"account matches\",\n  };\n\n  function identifierProblem(value) {\n    var v = value.trim();\n    if (!v) return SAY.emptyIdentifier;\n    if (v.indexOf(\"@\") !== -1) return /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(v) ? null : SAY.badAddress;\n    return /^[A-Za-z0-9._-]{2,64}$/.test(v) ? null : SAY.badUsername;\n  }\n\n  function clearErrors(form) {\n    var shown = form.querySelectorAll(\".osprey-field-error\");\n    for (var i = 0; i < shown.length; i++) shown[i].parentNode.removeChild(shown[i]);\n    var marked = form.querySelectorAll(\"[aria-invalid]\");\n    for (var j = 0; j < marked.length; j++) {\n      marked[j].removeAttribute(\"aria-invalid\");\n      marked[j].removeAttribute(\"aria-describedby\");\n    }\n  }\n\n  function showError(field, message) {\n    var id = field.id + \"-osprey-error\";\n    var said = document.createElement(\"span\");\n    said.id = id;\n    said.className = \"osprey-field-error\";\n    said.textContent = message;\n    // Directly under the field's own box (the password's box and its show button are one group),\n    // before any help that follows it.\n    var box = field.closest(\".pf-v5-c-input-group\") || field.closest(\".pf-v5-c-form-control\") || field;\n    box.parentNode.insertBefore(said, box.nextSibling);\n    field.setAttribute(\"aria-invalid\", \"true\");\n    field.setAttribute(\"aria-describedby\", id);\n  }\n\n  function guard(form, checks) {\n    form.noValidate = true;\n    form.addEventListener(\"submit\", function (event) {\n      clearErrors(form);\n      var first = null;\n      for (var i = 0; i < checks.length; i++) {\n        var field = form.querySelector(\"#\" + checks[i].id);\n        if (!field) continue;\n        var problem = checks[i].problem(field.value);\n        if (problem) {\n          showError(field, problem);\n          first = first || field;\n        }\n      }\n      if (first) {\n        event.preventDefault();\n        // Keycloak's own `onsubmit` has already disabled its button (measured on 26.0.8); a refused\n        // submit gives\
    \ it back, or the corrected form could not be sent.\n        var buttons = form.querySelectorAll(\"[type=submit]\");\n        for (var b = 0; b < buttons.length; b++) buttons[b].disabled = false;\n        if (first.focus) first.focus();\n      }\n    });\n  }\n\n  function addAfter(form, className, text) {\n    var line = document.createElement(\"p\");\n    line.className = className;\n    line.textContent = text;\n    form.parentNode.insertBefore(line, form.nextSibling);\n    return line;\n  }\n\n  function sentAlert() {\n    var alerts = document.querySelectorAll(\".pf-v5-c-alert.pf-m-success, .alert-success\");\n    for (var i = 0; i < alerts.length; i++) {\n      if (alerts[i].textContent.trim().indexOf(SAY.sentStarts) === 0) return alerts[i];\n    }\n    return null;\n  }\n\n  function start() {\n    var login = document.getElementById(\"kc-form-login\");\n    var reset = document.getElementById(\"kc-reset-password-form\");\n    var title = document.getElementById(\"kc-page-title\");\n\n    if (login) {\n      guard(login, [\n        { id: \"username\", problem: identifierProblem },\n        { id: \"password\", problem: function (v) { return v ? null : SAY.emptyPassword; } },\n      ]);\n      if (!window.OSPREY_RESET_BY_EMAIL) {\n        var password = login.querySelector(\"#password\");\n        var group = password && (password.closest(\".pf-v5-c-form__group\") || password.parentNode);\n        if (group) {\n          var help = document.createElement(\"p\");\n          help.className = \"osprey-no-reset\";\n          help.textContent = SAY.noReset;\n          group.appendChild(help);\n        }\n      }\n      addAfter(login, \"osprey-card-foot\", SAY.foot);\n\n      if (sentAlert() && title) {\n        login.hidden = true;\n        title.textContent = SAY.checkEmail;\n        var back = document.createElement(\"button\");\n        back.type = \"button\";\n        back.className = \"pf-v5-c-button pf-m-secondary osprey-back\";\n        back.textContent = SAY.back;\n        back.addEventListener(\"click\", function () {\n          login.hidden = false;\n          title.textContent = SAY.signIn;\n          var alert = sentAlert();\n          if (alert) alert.hidden = true;\n          back.parentNode.removeChild(back);\n        });\n        login.parentNode.insertBefore(back, login);\n      }\n    }\n\n    if (reset) {\n      // Keycloak puts the instruction after the form; the handoff's card has it under the title.\n      var info = document.getElementById(\"kc-info\");\n      if (info) {\n        info.classList.add(\"osprey-lead\");\n        reset.parentNode.insertBefore(info, reset);\n      }\n      guard(reset, [{ id: \"username\", problem: identifierProblem }]);\n      var submit = reset.querySelector(\"[type=submit]\");\n      if (submit) {\n        if (submit.tagName === \"INPUT\") submit.value = SAY.sendReset;\n        else submit.textContent = SAY.sendReset;\n      }\n    }\n  }\n\n  if (document.readyState === \"loading\") document.addEventListener(\"DOMContentLoaded\", start);\n  else start();\n})();\n"
