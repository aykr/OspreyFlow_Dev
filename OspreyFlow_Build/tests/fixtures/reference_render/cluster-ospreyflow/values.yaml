jobs:
- name: ollama-models
  image: ollama/ollama@sha256:5a5d014aa774f78ebe1340c0d4afc2e35afc12a2c3b34c84e71f78ea20af4ba3
  egress: true
  command:
  - /bin/sh
  - -c
  args:
  - "set -e\nollama serve &\nserver=$!\nuntil ollama list >/dev/null 2>&1; do sleep 1; done\npull_and_verify() {\n  model=\"$1\"; expected=\"$2\"\n  actual=\"$$(ollama list | awk -v m=\"$model\" '$1 == m {print $2}')\"\n  if [ \"$actual\" != \"$expected\" ]; then\n    ollama pull \"$model\" || {\n      echo \"FATAL: $model is not on this machine at the recorded version, and it could not be fetched. A first start needs the network once, to fetch the model weights: connect this machine to the network, then start again. The weights are kept, so later starts need no network.\" >&2\n      exit 1\n    }\n    actual=\"$$(ollama list | awk -v m=\"$model\" '$1 == m {print $2}')\"\n    if [ \"$actual\" != \"$expected\" ]; then\n      echo \"FATAL: $model resolved to manifest $actual, expected $expected (spec/06_DECISIONS.md ADR-020) \u2014 the tag moved upstream; update the ADR deliberately, do not proceed silently.\" >&2\n      exit 1\n    fi\n  fi\n}\npull_and_verify qwen2.5:0.5b-instruct a8b0c5157701\npull_and_verify all-minilm:22m-l6-v2-fp16 1b226e2802db\npull_and_verify moondream:1.8b-v2-q4_K_M c865c80afc38\npull_and_verify qwen2.5:7b-instruct 845dbda0ea48\nkill \"$server\"\nwait \"$server\" || true\nexec sleep infinity\n"
  shared:
  - subPath: models/ollama
    mountPath: /root/.ollama
    readOnly: false
  kind: Job
- name: whisper-models
  image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
  egress: true
  command:
  - /bin/sh
  - -c
  args:
  - "(model_is_complete() {\n  snapshot=\"$$(HF_HUB_OFFLINE=1 huggingface-cli download Systran/faster-whisper-tiny.en 2>/dev/null | tail -n 1)\"\n  [ -d \"$snapshot\" ] || return 1\n  [ \"$$(basename \"$snapshot\")\" = 0d3d19a32d3338f10357c0889762bd8d64bbdeba ] || return 1\n  for file in config.json model.bin tokenizer.json; do\n    [ -s \"$snapshot/$file\" ] || return 1\n  done\n  set -- \"$snapshot\"/vocabulary.*\n  [ -s \"$1\" ] || return 1\n  set -- \"$snapshot\"/../../blobs/*.incomplete\n  [ ! -e \"$1\" ] || return 1\n}\nif model_is_complete; then\n  echo 'Systran/faster-whisper-tiny.en is already on this machine; nothing to fetch.'\nelse\n  rm -f /home/ubuntu/.cache/huggingface/hub/models--Systran--faster-whisper-tiny.en/blobs/*.incomplete\n  huggingface-cli download --force-download Systran/faster-whisper-tiny.en || true\n  model_is_complete || {\n    echo 'FATAL: the speech model Systran/faster-whisper-tiny.en is not on this machine at the recorded version 0d3d19a32d3338f10357c0889762bd8d64bbdeba, or not all of it, and it could not be fetched. A first start needs the network once, to fetch the model weights: connect this machine to the network, then start again. If the network is fine, the model moved upstream: update TRANSCRIPTION_MODEL_REVISIONS deliberately, do not proceed silently. The weights are kept, so later starts need no network.' >&2\n    exit 1\n  }\nfi\nchown -R 1000:1000 /home/ubuntu/.cache/huggingface\n) && touch /home/ubuntu/.cache/huggingface/.ospreyflow-whisper-models-done"
  runAs:
    user: 0
    group: 0
  shared: *id004
  kind: Job
