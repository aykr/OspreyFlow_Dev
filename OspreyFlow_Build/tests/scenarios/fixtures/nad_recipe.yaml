# Recipe for the National Address Database (NAD) — `process/07_BUILD_PLAN.md`
# Phase 5 Checkpoint 3c. `nad_address_id` is a new gazetteer identifier
# (this checkpoint's ontology bump, v9). Coverage is voluntary and
# state-contributed, so it is uneven — a real deployment's own NAD load
# may cover far fewer areas than the other six sources here; that is a
# data-coverage property, not something this recipe/connector needs to
# handle specially.
id: nad-gazetteer
version: 1
label: "National Address Database (US address-point gazetteer)"
connector:
  profile: geo-generic-csv
  delimiter: ","
  encoding: utf-8
  header_rows: 1
  source_crs: "EPSG:4326"
ontology_version: 12

defaults:
  provenance: {state: asserted}
  handling: {classification: OFFICIAL, handling_code: P, originator: unit-1, owning_unit: unit-1}

row_template:
  entities:
    - ref: address
      pole_class: location
      type: Location
      match_on: nad_address_id
      on_match: reference
      properties:
        nad_address_id: {field: NAD_ADDRESS_ID}
        name: {field: StreetAddress}
        geometry_ref: {fields: [Longitude, Latitude], transform: geometry_ref}

unmapped_fields:
  - {field: City, action: ignore}
  - {field: State, action: ignore}
  - {field: Zip, action: ignore}
