# Recipe for Census TIGER-Line — `process/07_BUILD_PLAN.md` Phase 5
# Checkpoint 3c. `tiger_geoid` is already a Location identifier (used as
# a plausible id value by the CRS-reprojection fixtures, never actually
# produced by a TIGER-Line-shaped connector until now).
#
# Real TIGER-Line road-segment records carry address *ranges* along the
# segment (`LFROMHN`/`LTOHN`/`RFROMHN`/`RTOHN`), not a point — a genuine
# format difference from every other gazetteer here, per
# `process/07_BUILD_PLAN.md`'s own stated caveat. This recipe maps a
# pre-computed representative point (`MID_LON`/`MID_LAT`) rather than
# performing real range-to-point interpolation, which is a Phase-6/
# extraction-time computation, not this connector's job — flagged, not
# silently treated as a real point address.
id: tiger-line-gazetteer
version: 1
label: "Census TIGER-Line (US road-segment gazetteer)"
connector:
  profile: geo-generic-csv
  delimiter: ","
  encoding: utf-8
  header_rows: 1
  source_crs: "EPSG:4326"
ontology_version: 14

defaults:
  provenance: {state: asserted}
  handling: {classification: OFFICIAL, handling_code: P, originator: unit-1, owning_unit: unit-1}

row_template:
  entities:
    - ref: segment
      pole_class: location
      type: Location
      match_on: tiger_geoid
      on_match: reference
      properties:
        tiger_geoid: {field: TLID}
        name: {field: FULLNAME}
        geometry_ref: {fields: [MID_LON, MID_LAT], transform: geometry_ref}

unmapped_fields:
  - {field: LFROMHN, action: ignore, note: "Address range, not a point — see this file's own header comment."}
  - {field: LTOHN, action: ignore}
  - {field: RFROMHN, action: ignore}
  - {field: RTOHN, action: ignore}
