[pytest]
# The Build folder owns the test settings (spec/06_DECISIONS.md ADR-054). Paths are relative to this
# file: `../OspreyFlow_Core` is the product.
pythonpath = ../OspreyFlow_Core ../OspreyFlow_Core/packages ../OspreyFlow_Core/cli .
testpaths = tests
asyncio_mode = auto
markers =
    slow: a case that takes minutes and is not part of `make ci` (it also skips unless OSPREYFLOW_RUN_SLOW=1)
