# Stand-ins for the platform's managed stores on R1's kind cluster (`r1_kind.py platform`), as P7's, in their own
# namespace, as RDS, ElastiCache and S3 are outside the deployment's: Postgres 16 over TLS and Valkey over
# TLS with a password (S3 is r1_kind.py's S3, STS and KMS stand-in). Throwaway credentials; never a deployment's.
# **The Postgres stand-in refuses what RDS refuses** (CLAUDE.md rule 15, reviewer point 9): its master user
# (`osprey`) is not a superuser, only CREATEDB and CREATEROLE as RDS's `rds_superuser` grants, and a
# connection without TLS is refused (RDS for PostgreSQL 15 and later: `rds.force_ssl=1` by default).
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: platform-managed}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: platform-managed}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      initContainers:
        - name: key
          image: localhost:5001/postgres:16.4
          command: ["sh", "-c", "cp /tls/tls.crt /tls/tls.key /pgtls/ && printf 'local all all trust\\nhostssl all all all scram-sha-256\\nhost all all all reject\\n' > /pgtls/pg_hba.conf && chown 999:999 /pgtls/* && chmod 600 /pgtls/tls.key"]
          volumeMounts: [{name: tls, mountPath: /tls}, {name: pgtls, mountPath: /pgtls}]
      containers:
        - name: postgres
          image: localhost:5001/postgres:16.4
          # max_connections as the Terraform sets it in the parameter group (ADR-114 Am 46): filled in
          # at apply from harness.cloud_platform.connections, never a number of its own (r1_kind.standins_text).
          args: ["-c", "max_connections=${MAX_CONNECTIONS}", "-c", "ssl=on", "-c", "ssl_cert_file=/pgtls/tls.crt", "-c", "ssl_key_file=/pgtls/tls.key",
                 "-c", "hba_file=/pgtls/pg_hba.conf"]
          env:
            # The image's superuser is the platform's, never handed out; `osprey` is the master user.
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_PASSWORD, value: ${PASSWORD}-root}
          readinessProbe: {exec: {command: ["pg_isready", "-U", "postgres"]}, periodSeconds: 5}
          volumeMounts: [{name: pgtls, mountPath: /pgtls}, {name: rds, mountPath: /docker-entrypoint-initdb.d}]
      volumes:
        - {name: tls, secret: {secretName: standin-tls}}
        - {name: pgtls, emptyDir: {}}
        - name: rds
          configMap: {name: rds-master}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: rds-master, namespace: platform-managed}
data:
  master.sql: |
    CREATE ROLE osprey LOGIN CREATEDB CREATEROLE NOSUPERUSER PASSWORD '${PASSWORD}';
    CREATE DATABASE ospreyflow OWNER osprey;
---
apiVersion: v1
kind: Service
metadata: {name: valkey, namespace: platform-managed}
spec:
  selector: {app: valkey}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: valkey, namespace: platform-managed}
spec:
  serviceName: valkey
  replicas: 1
  selector: {matchLabels: {app: valkey}}
  template:
    metadata: {labels: {app: valkey}}
    spec:
      containers:
        - name: valkey
          image: localhost:5001/valkey/valkey:8.0
          args: ["--port", "0", "--tls-port", "6379", "--tls-cert-file", "/tls/tls.crt", "--tls-key-file",
                 "/tls/tls.key", "--tls-ca-cert-file", "/tls/ca.crt", "--tls-auth-clients", "no",
                 "--requirepass", "${PASSWORD}"]
          readinessProbe: {tcpSocket: {port: 6379}, periodSeconds: 5}
          volumeMounts: [{name: tls, mountPath: /tls}]
      volumes: [{name: tls, secret: {secretName: standin-tls}}]
---
# The OpenSearch behind the domain's stand-in (v0.5.2, ADR-148 Amendment 13): the S3/STS stand-in answers
# as the domain (SigV4 for es, the domain's roles, its own 403s) and proxies only what it admits here, on
# 9200 inside the platform's namespace. The security plugin is off as the domain has no fine-grained access
# control; one node, as kind has one (the real domain's two nodes in two zones are the Terraform's, not
# modelled). Its disk outlives a restart, as the domain's; it goes with decommission step 7.
apiVersion: v1
kind: Service
metadata: {name: opensearch, namespace: platform-managed}
spec:
  selector: {app: opensearch}
  ports: [{port: 9200, targetPort: 9200}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: opensearch, namespace: platform-managed}
spec:
  serviceName: opensearch
  replicas: 1
  selector: {matchLabels: {app: opensearch}}
  template:
    metadata: {labels: {app: opensearch}}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: opensearch
          image: localhost:5001/opensearchproject/opensearch:2.17.1
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports: [{containerPort: 9200}]
          resources: {requests: {memory: 1Gi}, limits: {memory: 1536Mi}}
          readinessProbe: {httpGet: {path: /_cluster/health, port: 9200}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /usr/share/opensearch/data}]
  volumeClaimTemplates:
    - metadata: {name: data, labels: {app: opensearch}}
      spec: {accessModes: [ReadWriteOnce], storageClassName: gp2-expand, resources: {requests: {storage: 5Gi}}}
