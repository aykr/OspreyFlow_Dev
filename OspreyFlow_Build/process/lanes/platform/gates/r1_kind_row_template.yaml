# R1's load (r1_kind.py check): a person and the synthetic number they use, mapped as an analyst maps a
# two-column file in the Ingest Studio (the shape of tests/ingest/fixtures/visits_contacts_calls). Synthetic.
# Nested under `put_row_template`, the body of PUT /recipes/{id}/row-template: at the top level its
# `row_template` made it a recipe to test_committed_recipes_pin.py (which finds recipes by that key) and
# failed CI's conformance job at 9c1fdfe, as no recipe (no id, version, label, connector or ontology).
put_row_template:
  row_template:
    entities:
      - ref: person
        pole_class: person
        type: Person
        on_match: create
        properties:
          family_name: {field: family_name}
          given_names: {field: given_names}
      - ref: phone
        pole_class: object
        type: Endpoint
        match_on: value_normalised
        on_match: reference
        properties:
          value_raw: {field: phone}
          value_normalised: {field: phone, transform: msisdn}
          endpoint_kind: {literal: msisdn}
    edges:
      - type: USES
        from: person
        to: phone
  unmapped_fields: []
